[test]
root = "./test"
# Forces DATA_DIR to .data-test for every `bun test` run, including bare
# single-file runs that bypass the package.json `test` script. Without this,
# suites doing unconditional wipes destroy the real user DB.
preload = ["./test/support/setup-data-dir.ts"]
timeout = 30000
maxConcurrency = 5
