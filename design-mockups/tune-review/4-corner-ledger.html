<!doctype html><html><head><meta charset="utf-8"><title>Design 4 — Corner Ledger</title>
<link rel="stylesheet" href="shared.css">
<style>
table { width:100%; border-collapse: collapse; font-size:13px; }
th { text-align:left; font-size:10.5px; text-transform:uppercase; letter-spacing:.07em; color:var(--app-text-dim); padding:6px 10px; border-bottom:1px solid var(--app-border); }
td { padding:7px 10px; border-bottom:1px solid var(--app-border); vertical-align:middle; }
tr:hover td { background: var(--app-surface-alt); }
.pill { font-size:10.5px; padding:1px 7px; border-radius:999px; }
.pill.b { background:#7f1d1d55; color:#fca5a5; border:1px solid #7f1d1d; }
.pill.w { background:#78350f55; color:#fcd34d; border:1px solid #78350f; }
.pill.g { background:#064e3b55; color:#6ee7b7; border:1px solid #064e3b; }
</style></head><body><div class="page">
<div class="topbar"><h1>Design 4 — Corner Ledger</h1>
  <span class="sub" id="meta"></span><span class="spacer"></span><a href="index.html">← all designs</a></div>

<div class="grid" style="grid-template-columns:1fr 320px; align-items:start;">
<div class="card">
  <h2>Corner-by-corner — focus lap vs best, input sparklines per zone</h2>
  <table id="tbl"><thead><tr>
    <th>Corner</th><th>Min speed</th><th>Δ best</th><th>Brake pt var</th><th>Inputs (zone)</th><th>Δ time</th><th>Verdict</th>
  </tr></thead><tbody></tbody></table>
</div>
<div class="grid" style="grid-template-columns:1fr;">
  <div class="card stat"><span class="l">Consistency score</span><span class="v" id="cons"></span>
    <span class="d">Brake-point variance drives most spread — see T4, T8</span></div>
  <div class="card"><h2>Where time goes</h2><svg id="waterfall" width="100%" height="230"></svg></div>
</div>
</div>
</div>
<script src="data.js"></script>
<script>
const S = STINT, C = S.C;
meta.textContent = `${S.meta.car} · ${S.meta.track} · ${S.meta.tune}`;
cons.textContent = S.consistency.toFixed(0);
cons.className = "v " + (S.consistency>85?"good":S.consistency>70?"warn":"bad");

// per-corner metrics from traces
function zone(trace, c){ return trace.filter(s=>Math.abs(s.f-c.frac)<0.045); }
const rows = S.CORNERS.map((c,ci) => {
  const zf = zone(S.focusTrace,c), zb = zone(S.bestTrace,c);
  const minF = Math.min(...zf.map(s=>s.speed)), minB = Math.min(...zb.map(s=>s.speed));
  const dv = minF-minB;
  const brakeVar = (Math.abs(Math.sin(ci*2.7))*9+1);
  const dt = Math.max(0, -dv*0.011 + brakeVar*0.004);
  return { c, zf, zb, minF, minB, dv, brakeVar, dt };
});

function spark(zf){
  const w=120,h=26;
  let t="",b="",st="";
  zf.forEach((s,i)=>{ const x=i/(zf.length-1)*w;
    t += (i?"L":"M")+x.toFixed(1)+" "+(h-s.throttle*h).toFixed(1)+" ";
    b += (i?"L":"M")+x.toFixed(1)+" "+(h-s.brake*h).toFixed(1)+" ";
    st += (i?"L":"M")+x.toFixed(1)+" "+(h/2-s.steer*h/2).toFixed(1)+" "; });
  return `<svg width="${w}" height="${h}" style="display:block">
    <path d="${st}" fill="none" stroke="${C.steer}" stroke-width="1" opacity="0.8"/>
    <path d="${t}" fill="none" stroke="${C.throttle}" stroke-width="1.4"/>
    <path d="${b}" fill="none" stroke="${C.brake}" stroke-width="1.4"/></svg>`;
}

document.querySelector("#tbl tbody").innerHTML = rows.map(r => {
  const verdict = r.dt > 0.06 ? `<span class="pill b">losing ${r.dt.toFixed(2)}s</span>`
    : r.brakeVar > 7 ? `<span class="pill w">inconsistent</span>`
    : `<span class="pill g">on pace</span>`;
  return `<tr>
    <td><b>${r.c.n}</b> <span style="color:${C.dim};font-size:11px">${(r.c.frac*100).toFixed(0)}%</span></td>
    <td class="mono">${r.minF.toFixed(0)} km/h</td>
    <td class="mono ${r.dv<-4?"bad":r.dv<-1.5?"warn":"good"}">${r.dv>=0?"+":""}${r.dv.toFixed(1)}</td>
    <td class="mono ${r.brakeVar>7?"bad":r.brakeVar>4?"warn":"good"}">±${r.brakeVar.toFixed(0)} m</td>
    <td>${spark(r.zf)}</td>
    <td class="mono">${r.dt>0.005?"+"+r.dt.toFixed(3):"—"}</td>
    <td>${verdict}</td></tr>`;
}).join("");

// waterfall of time loss per corner
(function(){
  const svg = document.getElementById("waterfall"), W=svg.clientWidth||288, H=230;
  svg.setAttribute("viewBox",`0 0 ${W} ${H}`);
  const L=44,R=10,T=6,B=18, pw=W-L-R, ph=H-T-B;
  const sorted = [...rows].sort((a,b)=>b.dt-a.dt);
  const max = Math.max(...sorted.map(r=>r.dt), 0.01);
  const bh = ph/sorted.length;
  let html = "";
  sorted.forEach((r,i)=>{
    const w = r.dt/max*pw;
    const col = r.dt>0.06?C.red:r.dt>0.03?C.amber:"#0891b2";
    html += `<text class="axis" x="${L-6}" y="${T+i*bh+bh/2+3}" text-anchor="end">${r.c.n}</text>`;
    html += `<rect x="${L}" y="${T+i*bh+3}" width="${Math.max(2,w)}" height="${bh-6}" rx="3" fill="${col}"/>`;
    if (r.dt>0.005) html += `<text x="${L+w+5}" y="${T+i*bh+bh/2+3}" font-size="10" fill="${C.muted}" class="mono">+${r.dt.toFixed(2)}</text>`;
  });
  svg.innerHTML = html;
})();
</script></body></html>
