name: Bench compare

on:
  pull_request:
    branches: [main]

permissions:
  contents: read
  pull-requests: write
  issues: write

concurrency:
  group: bench-${{ github.head_ref }}
  cancel-in-progress: true

jobs:
  bench:
    runs-on:
      - mars-windows-x64
      - 4VCPU
      - 15G
    defaults:
      run:
        shell: powershell
    steps:
      - name: Checkout PR
        uses: actions/checkout@v7
        with:
          path: pr
      - name: Checkout base (main)
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          path: base
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - name: Install benchmark dependencies
        run: |
          $ErrorActionPreference = "Stop"
          Push-Location pr
          bun install --frozen-lockfile
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Pop-Location
          Push-Location base
          bun install --no-save --ignore-scripts
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Pop-Location
          New-Item -ItemType Directory -Force reports | Out-Null
      - name: Run counterbalanced benchmark rounds
        working-directory: pr
        run: |
          $ErrorActionPreference = "Stop"
          bun run scripts/quality/run-bench-ci.ts --base=../base --current=. --reports=../reports
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Upload benchmark comment
        uses: actions/upload-artifact@v7
        with:
          name: benchmark-comment
          path: reports/comparison.md
          if-no-files-found: error
          retention-days: 14
      - name: Upload benchmark reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-reports
          path: |
            reports/*.json
            reports/*.md
