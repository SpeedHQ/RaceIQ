name: Bench compare

on:
  pull_request:
    branches: [main]

permissions:
  contents: read
  pull-requests: write
  issues: write

concurrency:
  group: bench-${{ github.head_ref }}
  cancel-in-progress: true

jobs:
  bench:
    timeout-minutes: 30
    runs-on:
      - mars-windows-x64-4vcpu-15g
      - mars-macos-arm64-2vcpu-10g
    steps:
      - name: Checkout PR
        uses: actions/checkout@v7
        with:
          path: pr
      - name: Checkout base (main)
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          path: base
      - uses: oven-sh/setup-bun@v2
      - name: Install benchmark dependencies
        run: bun pr/scripts/ci/workflow-ops.ts bench-install
      - name: Run counterbalanced benchmark rounds
        run: bun pr/scripts/ci/workflow-ops.ts bench-run
      - name: Upload benchmark comment
        uses: actions/upload-artifact@v7
        with:
          name: benchmark-comment
          path: reports/comparison.md
          if-no-files-found: error
          retention-days: 14
      - name: Upload benchmark reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-reports
          path: |
            reports/*.json
            reports/*.md
