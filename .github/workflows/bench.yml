name: Bench compare

on:
  pull_request:
    branches: [main]

permissions:
  contents: read
  pull-requests: write
  issues: write

concurrency:
  group: bench-${{ github.head_ref }}
  cancel-in-progress: true

jobs:
  bench:
    runs-on:
      - whitesmith-windows-x64
      - 4VCPU
      - 15G
    defaults:
      run:
        shell: powershell
    steps:
      - name: Checkout PR
        uses: actions/checkout@v7
        with:
          path: pr
      - name: Checkout base (main)
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          path: base
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - name: Install benchmark dependencies
        run: |
          $ErrorActionPreference = "Stop"
          Push-Location pr
          bun install --frozen-lockfile
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Pop-Location
          Push-Location base
          bun install --no-save --ignore-scripts
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Pop-Location
          New-Item -ItemType Directory -Force reports | Out-Null
          Copy-Item -Force pr/scripts/quality/process-bench.ts base/scripts/quality/process-bench.ts
          Copy-Item -Force pr/test/benchmarks/process-bench-contracts.ts base/test/benchmarks/process-bench-contracts.ts
          Copy-Item -Force pr/test/benchmarks/process-bench-runtime.ts base/test/benchmarks/process-bench-runtime.ts
          Copy-Item -Force pr/test/benchmarks/process-bench-child.ts base/test/benchmarks/process-bench-child.ts
          Copy-Item -Force pr/test/benchmarks/replay-process-bench.ts base/test/benchmarks/replay-process-bench.ts
      - name: Run four counterbalanced benchmark rounds
        run: |
          $ErrorActionPreference = "Stop"
          $common = @("--processes=3", "--retained-processes=15", "--retained-warmups=1", "--warmup-ms=3000", "--measurement-ms=5000", "--min-samples=20", "--max-samples=200")
          function Run-Replay {
            param([string]$checkout, [string]$revision, [string]$reportName, [string]$caseOrder)
            Push-Location $checkout
            bun run scripts/quality/process-bench.ts --suite=replay --revision=$revision @common --case-order=$caseOrder --output="../reports/$reportName"
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            Pop-Location
          }
          Run-Replay "base" "base-1" "base-1.json" "forward"
          Run-Replay "pr" "current-1" "current-1.json" "forward"
          Run-Replay "pr" "current-2" "current-2.json" "reverse"
          Run-Replay "base" "base-2" "base-2.json" "reverse"
          Run-Replay "pr" "current-3" "current-3.json" "reverse"
          Run-Replay "base" "base-3" "base-3.json" "reverse"
          Run-Replay "base" "base-4" "base-4.json" "forward"
          Run-Replay "pr" "current-4" "current-4.json" "forward"
      - name: Compare paired benchmark reports
        working-directory: pr
        run: |
          $ErrorActionPreference = "Stop"
          $pairs = @(
            "../reports/base-1.json", "../reports/current-1.json",
            "../reports/base-2.json", "../reports/current-2.json",
            "../reports/base-3.json", "../reports/current-3.json",
            "../reports/base-4.json", "../reports/current-4.json"
          )
          $comparison = bun scripts/quality/bench-compare.ts @pairs --median-threshold=10 --retained-heap-threshold=10 --max-cpu-error=3 --max-retained-heap-error=5 --bootstrap-samples=10000 --fail-on-regression
          $comparison | Set-Content -Encoding utf8 ../reports/comparison.md
          $comparison | Add-Content $env:GITHUB_STEP_SUMMARY
          $comparison
      - name: Upload benchmark comment
        uses: actions/upload-artifact@v7
        with:
          name: benchmark-comment
          path: reports/comparison.md
          if-no-files-found: error
          retention-days: 14
      - name: Upload benchmark reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-reports
          path: |
            reports/*.json
            reports/*.md
