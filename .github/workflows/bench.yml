name: Bench compare

on:
  pull_request:
    branches: [main]

permissions:
  contents: read
  pull-requests: write
  issues: write

concurrency:
  group: bench-${{ github.head_ref }}
  cancel-in-progress: true

jobs:
  bench:
    runs-on:
      - whitesmith-windows-x64
      - 4VCPU
      - 15G
    steps:
      - name: Checkout PR
        uses: actions/checkout@v7
        with:
          path: pr

      - name: Checkout base (main)
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          path: base

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Install PR benchmark dependencies
        working-directory: pr
        run: bun install --frozen-lockfile

      - name: Run benchmarks on base
        working-directory: base
        run: |
          bun install --no-save --ignore-scripts
          bun run test/benchmarks/pipeline.bench.ts
          mv bench-results.json ../base-results.json
          if [ -f test/benchmarks/replay-io.bench.ts ]; then
            bun scripts/quality/replay-io-bench.ts --output=../base-replay-io-results.json
          fi

      - name: Run benchmarks on PR
        working-directory: pr
        run: |
          bun run test/benchmarks/pipeline.bench.ts
          mv bench-results.json ../pr-results.json
          bun scripts/quality/replay-io-bench.ts --output=../pr-replay-io-results.json

      - name: Compare
        working-directory: pr
        run: |
          bun scripts/quality/bench-compare.ts ../base-results.json ../pr-results.json --exclude=replay/ --informational > ../microbenchmark-comparison.md
          bun scripts/quality/bench-compare.ts ../base-results.json ../pr-results.json --include=replay/ --title="Replay CPU guardrails" --threshold=10 --p99-threshold=25 > ../replay-comparison.md
          if [ -f ../base-replay-io-results.json ]; then
            bun scripts/quality/bench-compare.ts ../base-replay-io-results.json ../pr-replay-io-results.json --threshold=25 --title="Replay I/O benchmark" > ../replay-io-comparison.md
          else
            {
              echo "## Replay I/O benchmark"
              echo
              echo "Base commit has no separate replay I/O benchmark. Current report uploaded; report-only comparison starts after this benchmark lands on the base branch."
            } > ../replay-io-comparison.md
          fi
          {
            cat ../microbenchmark-comparison.md
            echo
            cat ../replay-comparison.md
          } | tee ../comparison.md
          cat ../comparison.md >> "$GITHUB_STEP_SUMMARY"
          {
            echo
            cat ../replay-io-comparison.md
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Post fresh benchmark comment
        working-directory: pr
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          marker='<!-- bench-comparison -->'
          {
            echo "$marker"
            cat ../comparison.md
          } > ../benchmark-comment.md

          # Match screenshot-comment behavior: delete stale reports, then post
          # a fresh comment so the current result appears at the bottom.
          gh api --paginate "repos/${REPO}/issues/${PR}/comments" \
            --jq '.[] | select((.body | contains("<!-- bench-comparison -->")) or (.body | startswith("## Bench comparison"))) | .id' |
            while read -r comment_id; do
              gh api --method DELETE "repos/${REPO}/issues/comments/${comment_id}"
            done
          gh api "repos/${REPO}/issues/${PR}/comments" -F body=@../benchmark-comment.md

      - name: Enforce CPU benchmark guardrails
        working-directory: pr
        run: bun scripts/quality/bench-compare.ts ../base-results.json ../pr-results.json --include=replay/ --threshold=10 --p99-threshold=25 --fail-on-regression

      - name: Upload benchmark reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-reports
          path: |
            base-results.json
            pr-results.json
            base-replay-io-results.json
            pr-replay-io-results.json
            microbenchmark-comparison.md
            replay-comparison.md
            replay-io-comparison.md
            comparison.md
