name: Bench compare

on:
  pull_request:
    branches: [main]

permissions:
  contents: read
  pull-requests: write
  issues: write

concurrency:
  group: bench-${{ github.head_ref }}
  cancel-in-progress: true

jobs:
  bench:
    runs-on:
      - whitesmith-windows-x64
      - 4VCPU
      - 15G
    defaults:
      run:
        shell: powershell
    steps:
      - name: Checkout PR
        uses: actions/checkout@v7
        with:
          path: pr

      - name: Checkout base (main)
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          path: base

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Install benchmark dependencies
        run: |
          $ErrorActionPreference = "Stop"
          Push-Location pr
          bun install --frozen-lockfile
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Pop-Location
          Push-Location base
          bun install --no-save --ignore-scripts
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Pop-Location
          New-Item -ItemType Directory -Force reports | Out-Null

      - name: Run four counterbalanced benchmark rounds
        run: |
          $ErrorActionPreference = "Stop"
          function Run-Legacy($checkout, $output) {
            Push-Location $checkout
            bun run bench
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            Move-Item -Force bench-results.json ../reports/$output
            Pop-Location
          }
          function Run-Replay($checkout, $revision, $output) {
            Push-Location $checkout
            bun run scripts/quality/process-bench.ts --suite=replay --revision=$revision --processes=2 --warmups=2 --iterations=20 --output=../reports/$output
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            Pop-Location
          }
          # ABBA execution order: base→PR, PR→base, PR→base, base→PR.
          Run-Legacy base legacy-base-1.json
          Run-Replay base base-1.json
          Run-Legacy pr legacy-current-1.json
          Run-Replay pr current-1.json
          Run-Legacy pr legacy-current-2.json
          Run-Replay pr current-2.json
          Run-Legacy base legacy-base-2.json
          Run-Replay base base-2.json
          Run-Legacy pr legacy-current-3.json
          Run-Replay pr current-3.json
          Run-Legacy base legacy-base-3.json
          Run-Replay base base-3.json
          Run-Legacy base legacy-base-4.json
          Run-Replay base base-4.json
          Run-Legacy pr legacy-current-4.json
          Run-Replay pr current-4.json

      - name: Compare paired benchmark reports
        working-directory: pr
        run: |
          $ErrorActionPreference = "Stop"
          $pairs = @(
            "../reports/legacy-base-1.json", "../reports/legacy-current-1.json",
            "../reports/legacy-base-2.json", "../reports/legacy-current-2.json",
            "../reports/legacy-base-3.json", "../reports/legacy-current-3.json",
            "../reports/legacy-base-4.json", "../reports/legacy-current-4.json"
          )
          bun scripts/quality/bench-compare.ts @pairs --exclude=replay/ --informational --title="Informational microbenchmarks" |
            Set-Content -Encoding utf8 ../reports/microbenchmark-comparison.md
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $replayPairs = @(
            "../reports/base-1.json", "../reports/current-1.json",
            "../reports/base-2.json", "../reports/current-2.json",
            "../reports/base-3.json", "../reports/current-3.json",
            "../reports/base-4.json", "../reports/current-4.json"
          )
          bun scripts/quality/bench-compare.ts @replayPairs --include=replay/ --title="Replay CPU and retained heap guardrails" `
            --median-threshold=10 --p99-threshold=25 --retained-heap-threshold=10 |
            Set-Content -Encoding utf8 ../reports/replay-comparison.md
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $comparison = @(
            Get-Content ../reports/microbenchmark-comparison.md
            ""
            Get-Content ../reports/replay-comparison.md
          )
          $comparison | Set-Content -Encoding utf8 ../reports/comparison.md
          $comparison
          $comparison | Add-Content $env:GITHUB_STEP_SUMMARY

      - name: Upload benchmark comment
        uses: actions/upload-artifact@v7
        with:
          name: benchmark-comment
          path: reports/comparison.md
          if-no-files-found: error
          retention-days: 14

      - name: Enforce replay CPU and retained-heap guardrails
        working-directory: pr
        run: |
          bun scripts/quality/bench-compare.ts `
            ../reports/base-1.json ../reports/current-1.json `
            ../reports/base-2.json ../reports/current-2.json `
            ../reports/base-3.json ../reports/current-3.json `
            ../reports/base-4.json ../reports/current-4.json `
            --include=replay/ --median-threshold=10 --p99-threshold=25 `
            --retained-heap-threshold=10 --fail-on-regression

      - name: Upload benchmark reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-reports
          path: reports/*.json, reports/*.md
