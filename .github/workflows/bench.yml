name: Bench compare

on:
  pull_request:
    branches: [main]

permissions:
  contents: read
  pull-requests: write
  issues: write

concurrency:
  group: bench-${{ github.head_ref }}
  cancel-in-progress: true

jobs:
  bench:
    runs-on: blacksmith-2vcpu-ubuntu-2204
    steps:
      - name: Checkout PR
        uses: actions/checkout@v4
        with:
          path: pr

      - name: Checkout base (main)
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          path: base

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Install PR benchmark dependencies
        working-directory: pr
        run: bun install --frozen-lockfile

      - name: Run benchmarks on base
        working-directory: base
        run: |
          bun install --no-save --ignore-scripts
          bun run test/benchmarks/pipeline.bench.ts
          mv bench-results.json ../base-results.json
          if [ -f test/benchmarks/replay-io.bench.ts ]; then
            bun scripts/quality/replay-io-bench.ts --output=../base-replay-io-results.json
          fi

      - name: Run benchmarks on PR
        working-directory: pr
        run: |
          bun run test/benchmarks/pipeline.bench.ts
          mv bench-results.json ../pr-results.json
          bun scripts/quality/replay-io-bench.ts --output=../pr-replay-io-results.json

      - name: Compare
        id: compare
        working-directory: pr
        run: |
          bun scripts/quality/bench-compare.ts ../base-results.json ../pr-results.json --threshold=10 --p99-threshold=25 > ../pipeline-comparison.md
          if [ -f ../base-replay-io-results.json ]; then
            bun scripts/quality/bench-compare.ts ../base-replay-io-results.json ../pr-replay-io-results.json --threshold=25 > ../replay-io-comparison.md
          else
            {
              echo "## Replay I/O benchmark"
              echo
              echo "Base commit has no separate replay I/O benchmark. Current report uploaded; report-only comparison starts after this benchmark lands on the base branch."
            } > ../replay-io-comparison.md
          fi
          {
            cat ../pipeline-comparison.md
            echo
            cat ../replay-io-comparison.md
          } | tee ../comparison.md
          cat ../comparison.md >> "$GITHUB_STEP_SUMMARY"
          {
            echo 'body<<EOF'
            cat ../comparison.md
            echo 'EOF'
          } >> "$GITHUB_OUTPUT"

      - name: Find existing comment
        id: find
        uses: peter-evans/find-comment@v3
        with:
          issue-number: ${{ github.event.pull_request.number }}
          body-includes: "## Bench comparison"

      - name: Comment on PR (create or update)
        uses: peter-evans/create-or-update-comment@v4
        with:
          issue-number: ${{ github.event.pull_request.number }}
          comment-id: ${{ steps.find.outputs.comment-id }}
          body: ${{ steps.compare.outputs.body }}
          edit-mode: replace

      - name: Enforce CPU benchmark guardrails
        working-directory: pr
        run: bun scripts/quality/bench-compare.ts ../base-results.json ../pr-results.json --threshold=10 --p99-threshold=25 --fail-on-regression

      - name: Upload benchmark reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-reports
          path: |
            base-results.json
            pr-results.json
            base-replay-io-results.json
            pr-replay-io-results.json
            pipeline-comparison.md
            replay-io-comparison.md
            comparison.md
