name: Bench compare

on:
  pull_request:
    branches: [main]

permissions:
  contents: read
  pull-requests: write
  issues: write

concurrency:
  group: bench-${{ github.head_ref }}
  cancel-in-progress: true

jobs:
  bench:
    runs-on:
      - whitesmith-windows-x64
      - 4VCPU
      - 15G
    defaults:
      run:
        shell: powershell
    steps:
      - name: Checkout PR
        uses: actions/checkout@v7
        with:
          path: pr

      - name: Checkout base (main)
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          path: base

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Install PR benchmark dependencies
        working-directory: pr
        run: bun install --frozen-lockfile

      - name: Run benchmarks on base
        working-directory: base
        run: |
          $ErrorActionPreference = "Stop"
          bun install --no-save --ignore-scripts
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          # Use one replay benchmark definition for both revisions.
          Copy-Item -Force ../pr/test/benchmarks/pipeline.bench.ts test/benchmarks/pipeline.bench.ts
          bun run test/benchmarks/pipeline.bench.ts
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Move-Item -Force bench-results.json ../base-results.json
          if (Test-Path test/benchmarks/replay-io.bench.ts) {
            bun scripts/quality/replay-io-bench.ts --output=../base-replay-io-results.json
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }

      - name: Run benchmarks on PR
        working-directory: pr
        run: |
          $ErrorActionPreference = "Stop"
          bun run test/benchmarks/pipeline.bench.ts
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Move-Item -Force bench-results.json ../pr-results.json
          bun scripts/quality/replay-io-bench.ts --output=../pr-replay-io-results.json
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Compare
        working-directory: pr
        run: |
          $ErrorActionPreference = "Stop"
          bun scripts/quality/bench-compare.ts ../base-results.json ../pr-results.json --exclude=replay/ --informational |
            Set-Content -Encoding utf8 ../microbenchmark-comparison.md
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          bun scripts/quality/bench-compare.ts ../base-results.json ../pr-results.json --include=replay/ --title="Replay CPU guardrails" --threshold=10 --p99-threshold=25 |
            Set-Content -Encoding utf8 ../replay-comparison.md
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if (Test-Path ../base-replay-io-results.json) {
            bun scripts/quality/bench-compare.ts ../base-replay-io-results.json ../pr-replay-io-results.json --threshold=25 --title="Replay I/O benchmark" |
              Set-Content -Encoding utf8 ../replay-io-comparison.md
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          } else {
            @(
              "## Replay I/O benchmark"
              ""
              "Base commit has no separate replay I/O benchmark. Current report uploaded; report-only comparison starts after this benchmark lands on base branch."
            ) | Set-Content -Encoding utf8 ../replay-io-comparison.md
          }
          $comparison = @(
            Get-Content ../microbenchmark-comparison.md
            ""
            Get-Content ../replay-comparison.md
          )
          $comparison | Set-Content -Encoding utf8 ../comparison.md
          $comparison
          $comparison | Add-Content $env:GITHUB_STEP_SUMMARY
          Add-Content $env:GITHUB_STEP_SUMMARY ""
          Get-Content ../replay-io-comparison.md | Add-Content $env:GITHUB_STEP_SUMMARY

      - name: Upload benchmark comment
        uses: actions/upload-artifact@v7
        with:
          name: benchmark-comment
          path: comparison.md
          if-no-files-found: error
          retention-days: 14

      - name: Enforce CPU benchmark guardrails
        working-directory: pr
        run: bun scripts/quality/bench-compare.ts ../base-results.json ../pr-results.json --include=replay/ --threshold=10 --p99-threshold=25 --fail-on-regression

      - name: Upload benchmark reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-reports
          path: |
            base-results.json
            pr-results.json
            base-replay-io-results.json
            pr-replay-io-results.json
            microbenchmark-comparison.md
            replay-comparison.md
            replay-io-comparison.md
            comparison.md
