name: Release

on:
  workflow_dispatch:
    inputs:
      bump:
        description: "Version bump type"
        required: true
        type: choice
        options:
          - patch
          - minor
          - major
      skip_tests:
        description: "Skip broad Playwright suite; release-to-main upgrade smoke still runs"
        required: false
        type: boolean
        default: false
  release:
    types: [published]

concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: true

permissions:
  contents: write
  pull-requests: write
jobs:
  # --- Triggered by manual dispatch: compute version, build, create draft ---
  compute-version:
    timeout-minutes: 30
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.bump.outputs.version }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.3

      - name: Install workspace dependencies
        run: bun install --frozen-lockfile --ignore-scripts

      - name: Compute new version
        id: bump
        env:
          RELEASE_BUMP: ${{ inputs.bump }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: bun scripts/ci/compute-release-version.ts

  build:
    timeout-minutes: 30
    if: github.event_name == 'workflow_dispatch'
    needs: compute-version
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.3
      - name: Set version in package.json
        run: bun scripts/ci/update-release-version.ts "${{ needs.compute-version.outputs.version }}"

      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Verify database upgrade startup
        env:
          RACEIQ_DB_UPGRADE_TESTS: "1"
        run: bun test ./apps/backend/test/db/database-path.test.ts --timeout 120000

      - name: Generate release note artifact
        run: bun packages/tooling-release/src/release/generate-release-note.ts "${{ needs.compute-version.outputs.version }}"

      - name: Build client
        run: bun scripts/ci/workflow-ops.ts release-client

      - name: Prepare dist
        run: bun scripts/ci/workflow-ops.ts prepare-dist

      - name: Copy client assets
        run: bun scripts/ci/workflow-ops.ts copy-client

      - name: Copy shared data
        run: bun packages/tooling-build/src/build/copy-shared-data.ts
      - name: Optimize packaged images
        run: bun packages/tooling-build/src/build/optimize-client-images.ts

      - name: Compile server binary
        run: bun packages/tooling-build/src/build/compile-release.ts "${{ needs.compute-version.outputs.version }}"

      - name: Patch PE version info (ProductName)
        run: bun scripts/ci/workflow-ops.ts patch-pe

      - name: Copy native addons
        run: bun scripts/ci/workflow-ops.ts copy-addon


      - name: Smoke test server startup
        run: bun scripts/ci/workflow-ops.ts smoke-server
      - name: Install Inno Setup
        run: bun scripts/ci/workflow-ops.ts install-inno

      - name: Build installer
        shell: cmd
        run: |
          SET VERSION=${{ needs.compute-version.outputs.version }}
          iscc /DMyAppVersion=%VERSION% installer\raceiq.iss

      - name: Upload dist artifact (for E2E test)
        uses: actions/upload-artifact@v7
        with:
          name: raceiq-dist-windows
          path: dist/
          retention-days: 1


      - uses: actions/upload-artifact@v7
        with:
          name: raceiq-v${{ needs.compute-version.outputs.version }}-setup
          path: RaceIQ-Setup-v${{ needs.compute-version.outputs.version }}.exe

      - uses: actions/upload-artifact@v7
        with:
          name: raceiq-v${{ needs.compute-version.outputs.version }}-release-note
          path: releasenote.md

      - name: Summarize release test mode
        env:
          SKIP_TESTS: ${{ inputs.skip_tests }}
        run: bun scripts/ci/workflow-ops.ts release-summary

  build-linux:
    if: github.event_name == 'workflow_dispatch'
    needs: compute-version
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.3
      - name: Set package version
        run: bun scripts/ci/update-release-version.ts "${{ needs.compute-version.outputs.version }}"
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Install zsyncmake
        run: sudo apt-get update && sudo apt-get install --no-install-recommends -y zsync
      - name: Build Linux server and client
        run: bun run build
      - name: Optimize packaged images
        run: bun packages/tooling-build/src/build/optimize-client-images.ts
      - name: Build AppImage
        run: bun packages/tooling-build/src/build/build-appimage.ts "${{ needs.compute-version.outputs.version }}"
      - name: Smoke AppImage runtime
        run: bun scripts/ci/smoke-appimage.ts "$PWD/RaceIQ-v${{ needs.compute-version.outputs.version }}-linux-x86_64.AppImage" 2>&1 | tee "$RUNNER_TEMP/appimage-smoke.log"
      - name: Extract AppImage
        run: |
          mkdir -p "$RUNNER_TEMP/appimage"
          cd "$RUNNER_TEMP/appimage"
          "$GITHUB_WORKSPACE/RaceIQ-v${{ needs.compute-version.outputs.version }}-linux-x86_64.AppImage" --appimage-extract
      - name: Install Chromium
        working-directory: playwright
        run: bunx playwright install --with-deps chromium
      - name: Run packaged fresh-install browser flow
        working-directory: playwright
        env:
          E2E_SERVER_MODE: compiled
          PW_SERVER_SET: fresh
          PW_COMPILED_BINARY: ${{ runner.temp }}/appimage/squashfs-root/AppRun
        run: bunx playwright test --project=fresh-install tests/fresh-install/fresh-install.spec.ts --grep 'user steps through wizard and lands on home page' --workers=1
      - name: Upload AppImage smoke log
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: raceiq-appimage-smoke-log
          path: ${{ runner.temp }}/appimage-smoke.log
          if-no-files-found: ignore
          retention-days: 14
      - name: Upload AppImage verification evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: raceiq-appimage-verification
          path: playwright/test-results/
          if-no-files-found: ignore
          retention-days: 14
      - name: Upload AppImage
        uses: actions/upload-artifact@v7
        with:
          name: raceiq-v${{ needs.compute-version.outputs.version }}-appimage
          path: |
            RaceIQ-v${{ needs.compute-version.outputs.version }}-linux-x86_64.AppImage
            RaceIQ-v${{ needs.compute-version.outputs.version }}-linux-x86_64.AppImage.zsync
          if-no-files-found: error
          retention-days: 14


  upgrade-smoke:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.3
      - name: Verify release-to-main upgrade in Ubuntu Docker
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: bun run test:upgrade
      - name: Upload source upgrade smoke evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: source-upgrade-smoke
          path: playwright/test-results/source-upgrade/
          if-no-files-found: ignore
          retention-days: 14

  playwright-test:
    if: github.event_name == 'workflow_dispatch' && !inputs.skip_tests
    needs: build
    uses: ./.github/workflows/playwright-e2e.yml
  draft-release:
    timeout-minutes: 30
    if: ${{ always() && github.event_name == 'workflow_dispatch' && needs.compute-version.result == 'success' && needs.build.result == 'success' && needs.build-linux.result == 'success' && needs.upgrade-smoke.result == 'success' && (needs.playwright-test.result == 'success' || needs.playwright-test.result == 'skipped') }}
    needs: [compute-version, build, build-linux, upgrade-smoke, playwright-test]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.3
      - uses: actions/download-artifact@v8
        with:
          path: artifacts
          pattern: raceiq-v*

      - name: Delete existing draft for this tag
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: v${{ needs.compute-version.outputs.version }}
          REPO: ${{ github.repository }}
        run: bun scripts/ci/delete-draft-release.ts

      - name: Create draft release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: v${{ needs.compute-version.outputs.version }}
          name: RaceIQ v${{ needs.compute-version.outputs.version }}
          files: |
            artifacts/raceiq-v${{ needs.compute-version.outputs.version }}-setup/RaceIQ-Setup-v${{ needs.compute-version.outputs.version }}.exe
            artifacts/raceiq-v${{ needs.compute-version.outputs.version }}-appimage/RaceIQ-v${{ needs.compute-version.outputs.version }}-linux-x86_64.AppImage
            artifacts/raceiq-v${{ needs.compute-version.outputs.version }}-appimage/RaceIQ-v${{ needs.compute-version.outputs.version }}-linux-x86_64.AppImage.zsync
          fail_on_unmatched_files: true
          body_path: artifacts/raceiq-v${{ needs.compute-version.outputs.version }}-release-note/releasenote.md
          draft: true

  # --- Triggered when draft is published: commit version bump + tag ---
  finalize:
    timeout-minutes: 30
    if: github.event_name == 'release'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.3

      - name: Install workspace dependencies
        run: bun install --frozen-lockfile --ignore-scripts


      - name: Roll over changelog
        run: bun packages/tooling-release/src/release/rollover-changelog.ts "${{ github.event.release.tag_name }}" "${{ github.event.release.published_at }}"

      - name: Update version in package.json
        run: bun scripts/ci/update-release-version.ts "${{ github.event.release.tag_name }}"
      - name: Regenerate telemetry catalog
        run: bun run telemetry:catalog


      - name: Resolve release version
        id: release-version
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"

      - name: Create version bump pull request
        uses: peter-evans/create-pull-request@v7
        with:
          branch: release/v${{ steps.release-version.outputs.version }}
          delete-branch: true
          title: "chore: bump version to v${{ steps.release-version.outputs.version }}"
          update-title: true
          commit-message: "chore: bump version to ${{ steps.release-version.outputs.version }}"
          body: |
            Automated release finalization for v${{ steps.release-version.outputs.version }}.

            Includes changelog rollover, package version update, and regenerated telemetry catalog.
  publish-image:
    needs: finalize
    if: github.event_name == 'release' && needs.finalize.result == 'success'
    uses: ./.github/workflows/publish-image.yml
    permissions:
      contents: read
      packages: write
    with:
      release_tag: ${{ github.event.release.tag_name }}
    secrets: inherit
