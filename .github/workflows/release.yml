name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            target: bun-linux-x64
            artifact: forza-telemetry-linux-x64
            binary: forza-telemetry
          - os: macos-latest
            target: bun-darwin-arm64
            artifact: forza-telemetry-macos-arm64
            binary: forza-telemetry
          - os: windows-latest
            target: bun-windows-x64
            artifact: forza-telemetry-windows-x64
            binary: forza-telemetry.exe
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install

      - name: Build client
        run: cd client && bun install && bun run build

      - name: Prepare dist
        shell: bash
        run: mkdir -p dist

      - name: Copy client assets
        shell: bash
        run: cp -r client/dist dist/public

      - name: Copy shared data
        run: bun scripts/copy-shared-data.ts

      - name: Compile server binary
        shell: bash
        run: NODE_ENV=production bun build --compile --target=${{ matrix.target }} server/index.ts --outfile dist/${{ matrix.binary }}

      - name: Package
        shell: bash
        run: cd dist && zip -r ../${{ matrix.artifact }}.zip .

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.artifact }}.zip

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: "*.zip"
