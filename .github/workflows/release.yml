name: Release

on:
  workflow_dispatch:
    inputs:
      bump:
        description: "Version bump type"
        required: true
        type: choice
        options:
          - patch
          - minor
          - major
      skip_tests:
        description: "Skip release Playwright tests after local verification"
        required: false
        type: boolean
        default: false
  release:
    types: [published]

concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  # --- Triggered by manual dispatch: compute version, build, create draft ---
  compute-version:
    if: github.event_name == 'workflow_dispatch'
    runs-on:
      - mars-windows-x64
      - 4VCPU
      - 15G
    outputs:
      version: ${{ steps.bump.outputs.version }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Compute new version
        id: bump
        env:
          RELEASE_BUMP: ${{ inputs.bump }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: bun scripts/ci/compute-release-version.ts

  build:
    if: github.event_name == 'workflow_dispatch'
    needs: compute-version
    runs-on:
      - mars-windows-x64
      - 4VCPU
      - 15G
    steps:
      - uses: actions/checkout@v7

      - uses: oven-sh/setup-bun@v2
      - name: Set version in package.json
        run: bun scripts/ci/update-release-version.ts "${{ needs.compute-version.outputs.version }}"

      - name: Install dependencies
        run: bun install

      - name: Generate release note artifact
        shell: powershell
        run: bun scripts/release/generate-release-note.ts "${{ needs.compute-version.outputs.version }}"

      - name: Build client
        shell: powershell
        run: |
          Push-Location client
          bun install
          bun run build
          Pop-Location

      - name: Prepare dist
        shell: powershell
        run: New-Item -ItemType Directory -Force dist | Out-Null

      - name: Copy client assets
        shell: powershell
        run: Copy-Item -Recurse -Force client/dist dist/public

      - name: Copy shared data
        run: bun scripts/build/copy-shared-data.ts

      - name: Compile server binary
        shell: powershell
        run: |
          $env:NODE_ENV = "production"
          bun build --compile --target=bun-windows-x64 `
            --windows-icon=assets/raceiq.ico `
            --windows-title=RaceIQ `
            --windows-publisher=SpeedHQ `
            --windows-description="RaceIQ" `
            --windows-version="${{ needs.compute-version.outputs.version }}" `
            --define 'process.env.NODE_ENV="production"' `
            --define 'process.env.RACEIQ_FEATURE_F1_EXPERIMENTS="false"' `
            --define 'process.env.RACEIQ_FEATURE_IRACING_ADAPTER="false"' `
            server/bootstrap.ts --outfile dist/raceiq.exe

      - name: Patch PE version info (ProductName)
        shell: powershell
        run: |
          $rcedit = "$env:TEMP\rcedit.exe"
          Invoke-WebRequest -Uri "https://github.com/electron/rcedit/releases/download/v2.0.0/rcedit-x64.exe" -OutFile $rcedit
          & $rcedit dist\raceiq.exe --set-version-string "ProductName" "RaceIQ" --set-version-string "InternalName" "RaceIQ"

      - name: Copy libsql native addon
        shell: powershell
        run: |
          New-Item -ItemType Directory -Force dist/node_modules/@libsql/win32-x64-msvc | Out-Null
          Copy-Item -Force node_modules/@libsql/win32-x64-msvc/index.node, node_modules/@libsql/win32-x64-msvc/package.json dist/node_modules/@libsql/win32-x64-msvc/

      - name: Smoke test server startup
        shell: powershell
        run: |
          $server = Start-Process -FilePath (Resolve-Path "dist/raceiq.exe") -WorkingDirectory (Resolve-Path "dist") -PassThru
          try {
            $ready = $false
            for ($attempt = 0; $attempt -lt 30; $attempt++) {
              if ($server.HasExited) {
                throw "RaceIQ exited during startup with code $($server.ExitCode)"
              }
              try {
                Invoke-WebRequest -UseBasicParsing -Uri "http://127.0.0.1:3117/" | Out-Null
                $ready = $true
                break
              } catch {
                Start-Sleep -Seconds 1
              }
            }
            if (-not $ready) {
              throw "RaceIQ did not listen on port 3117 within 30 seconds"
            }
          } finally {
            if (-not $server.HasExited) {
              Stop-Process -Id $server.Id -Force
            }
          }

      - name: Upload dist artifact (for E2E test)
        uses: actions/upload-artifact@v7
        with:
          name: raceiq-dist-windows
          path: dist/
          retention-days: 1

      - name: Install Inno Setup
        shell: powershell
        run: |
          $url = "https://github.com/jrsoftware/issrc/releases/download/is-6_7_1/innosetup-6.7.1.exe"
          Invoke-WebRequest -Uri $url -OutFile "$env:TEMP\innosetup.exe"
          Start-Process -Wait -FilePath "$env:TEMP\innosetup.exe" -ArgumentList "/VERYSILENT", "/SUPPRESSMSGBOXES", "/DIR=C:\InnoSetup"
          echo "C:\InnoSetup" | Out-File -Append -Encoding utf8 $env:GITHUB_PATH

      - name: Build installer
        shell: cmd
        run: |
          SET VERSION=${{ needs.compute-version.outputs.version }}
          iscc /DMyAppVersion=%VERSION% installer\raceiq.iss

      - uses: actions/upload-artifact@v7
        with:
          name: raceiq-v${{ needs.compute-version.outputs.version }}-setup
          path: RaceIQ-Setup-v${{ needs.compute-version.outputs.version }}.exe

      - uses: actions/upload-artifact@v7
        with:
          name: raceiq-v${{ needs.compute-version.outputs.version }}-release-note
          path: releasenote.md

      - name: Summarize release test mode
        shell: powershell
        run: |
          if ("${{ inputs.skip_tests }}" -eq "true") {
            "## Release test mode`n`nPlaywright tests skipped by manual dispatch input after local verification." | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Encoding utf8 -Append
          } else {
            "## Release test mode`n`nPlaywright tests enabled." | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Encoding utf8 -Append
          }

  playwright-test:
    if: github.event_name == 'workflow_dispatch' && !inputs.skip_tests
    needs: build
    name: Release E2E (${{ matrix.name }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: fresh
            server_set: fresh
            projects: --project=fresh-install --project=mobile-device --project=tablet-device
            runs_on: '["mars-windows-x64", "2VCPU", "10G"]'
          - name: tunes
            server_set: tunes
            projects: --project=tunes
            runs_on: '["mars-windows-x64", "2VCPU", "10G"]'
          - name: tunes-unseeded
            server_set: tunes-unseeded
            projects: --project=tunes-unseeded
            runs_on: '["mars-windows-x64", "2VCPU", "10G"]'
          - name: seeded-shard-1
            server_set: seeded
            projects: --project=seeded-e2e --project=seeded-routes --project=seeded-imports
            shard: 1/5
            runs_on: '["mars-windows-x64", "4VCPU", "15G"]'
          - name: seeded-shard-2
            server_set: seeded
            projects: --project=seeded-e2e --project=seeded-routes --project=seeded-imports
            shard: 2/5
            runs_on: '["mars-windows-x64", "4VCPU", "15G"]'
          - name: seeded-shard-3
            server_set: seeded
            projects: --project=seeded-e2e --project=seeded-routes --project=seeded-imports
            shard: 3/5
            runs_on: '["mars-windows-x64", "4VCPU", "15G"]'
          - name: seeded-shard-4
            server_set: seeded
            projects: --project=seeded-e2e --project=seeded-routes --project=seeded-imports
            shard: 4/5
            runs_on: '["mars-windows-x64", "4VCPU", "15G"]'
          - name: seeded-shard-5
            server_set: seeded
            projects: --project=seeded-e2e --project=seeded-routes --project=seeded-imports
            shard: 5/5
            runs_on: '["mars-windows-x64", "4VCPU", "15G"]'
    uses: ./.github/workflows/playwright.yml
    with:
      server-mode: compiled
      server-set: ${{ matrix.server_set }}
      projects: ${{ matrix.projects }}
      shard: ${{ matrix.shard }}
      runs-on: ${{ matrix.runs_on }}
      dist-artifact: raceiq-dist-windows
      artifact-name: playwright-compiled-${{ matrix.name }}
      diagnostic-artifact-name: server-diagnostics-${{ matrix.name }}
  draft-release:
    if: ${{ always() && github.event_name == 'workflow_dispatch' && needs.compute-version.result == 'success' && needs.build.result == 'success' && (needs.playwright-test.result == 'success' || needs.playwright-test.result == 'skipped') }}
    needs: [compute-version, build, playwright-test]
    runs-on:
      - mars-windows-x64
      - 4VCPU
      - 15G
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - uses: actions/download-artifact@v8
        with:
          path: artifacts
          pattern: raceiq-v*

      - name: Delete existing draft for this tag
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: v${{ needs.compute-version.outputs.version }}
          REPO: ${{ github.repository }}
        run: bun scripts/ci/delete-draft-release.ts

      - name: Create draft release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: v${{ needs.compute-version.outputs.version }}
          name: RaceIQ v${{ needs.compute-version.outputs.version }}
          files: artifacts/raceiq-v${{ needs.compute-version.outputs.version }}-setup/RaceIQ-Setup-v${{ needs.compute-version.outputs.version }}.exe
          body_path: artifacts/raceiq-v${{ needs.compute-version.outputs.version }}-release-note/releasenote.md
          draft: true

  # --- Triggered when draft is published: commit version bump + tag ---
  finalize:
    if: github.event_name == 'release'
    runs-on:
      - mars-windows-x64
      - 4VCPU
      - 15G
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
      - uses: oven-sh/setup-bun@v2


      - name: Roll over changelog
        run: bun scripts/release/rollover-changelog.ts "${{ github.event.release.tag_name }}" "${{ github.event.release.published_at }}"

      - name: Update version in package.json
        run: bun scripts/ci/update-release-version.ts "${{ github.event.release.tag_name }}"

      - name: Commit version bump
        run: |
          TAG="${{ github.event.release.tag_name }}"
          VERSION="${TAG#v}"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add package.json CHANGELOG.md
          git commit -m "chore: bump version to $VERSION"
          git push
