name: Roll Back Docker Image

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: Release tag to restore as latest, for example v0.17.0
        required: true
        type: string

permissions:
  contents: read
  packages: write

jobs:
  rollback:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Point latest at release image
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          image_tag="${RELEASE_TAG#v}"
          if [[ ! "$image_tag" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "release_tag must be vMAJOR.MINOR.PATCH"
            exit 1
          fi
          docker buildx imagetools create \
            --tag ghcr.io/speedhq/raceiq:latest \
            ghcr.io/speedhq/raceiq:"$image_tag"
