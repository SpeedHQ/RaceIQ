name: Update dashboard screenshots in README

on:
  push:
    branches:
      - main
    paths:
      - "assets/screenshots/**"
  workflow_dispatch:

concurrency:
  group: update-screenshots-${{ github.ref_name }}
  cancel-in-progress: true

jobs:
  update-readme:
    runs-on:
      - mars-windows-x64
      - 4VCPU
      - 15G
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v7

      - name: Append dashboard screenshots to assets/screenshots/README.md
        run: bun scripts/ci/update-dashboard-readme.ts

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add assets/screenshots/README.md
          git diff --cached --quiet || git commit -m "chore: update dashboard screenshots [skip ci]"
          git push
