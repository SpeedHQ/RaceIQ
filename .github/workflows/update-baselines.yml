name: Update screenshot baselines

# Regenerates Storybook snapshot baselines in the pinned CI environment.
# Artifact delivery is the safe default so branch changes can be reviewed
# before commit. Optional commit delivery remains available for owned branches.

on:
  workflow_dispatch:
    inputs:
      target_ref:
        description: "Branch or ref to render"
        required: true
        default: "main"
        type: string
      delivery:
        description: "How to deliver generated baselines"
        required: true
        default: "artifact"
        type: choice
        options:
          - artifact
          - commit

concurrency:
  group: update-baselines-${{ inputs.target_ref }}
  cancel-in-progress: true

jobs:
  update:
    runs-on: blacksmith-4vcpu-ubuntu-2204
    # Same pinned image as the PR render job, so the baselines committed here
    # match exactly what PRs (and local `bun run snapshot:docker`) produce.
    container:
      image: mcr.microsoft.com/playwright:v1.62.0-jammy
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.target_ref }}
          persist-credentials: true

      - name: Mark workspace safe for git (container runs as root)
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Install unzip (required by setup-bun in the container)
        run: apt-get update && apt-get install -y --no-install-recommends unzip

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Install dependencies
        run: bun install

      - name: Install client dependencies
        working-directory: client
        run: bun install

      - name: Regenerate baselines
        working-directory: client
        env:
          RACEIQ_CANONICAL_SNAPSHOT_ENV: "1"
        # snapshot = playwright test --update-snapshots && copy to assets/screenshots
        run: bun run snapshot

      - name: Upload generated baselines
        uses: actions/upload-artifact@v7
        with:
          name: canonical-storybook-baselines-${{ github.run_id }}
          path: |
            client/src/stories/__snapshots__/snapshot-*.png
            assets/screenshots/*.png
          if-no-files-found: error
          retention-days: 14

      - name: Commit regenerated baselines to target branch
        if: inputs.delivery == 'commit'
        env:
          TARGET_REF: ${{ inputs.target_ref }}
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add client/src/stories/__snapshots__/snapshot-*.png assets/screenshots
          if git diff --cached --quiet; then
            echo "Baselines already match CI render."
          else
            git commit -m "chore(ci): regenerate dashboard baselines in CI env [skip ci]"
            git push origin "HEAD:${TARGET_REF}"
          fi
