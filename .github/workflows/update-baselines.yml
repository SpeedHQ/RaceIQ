name: Update screenshot baselines

# Regenerates Storybook snapshot baselines in the pinned CI environment.
# Artifact delivery is the safe default so branch changes can be reviewed
# before commit. Optional commit delivery remains available for owned branches.

on:
  workflow_dispatch:
    inputs:
      target_ref:
        description: "Branch or ref to render"
        required: true
        default: "main"
        type: string
      delivery:
        description: "How to deliver generated baselines"
        required: true
        default: "artifact"
        type: choice
        options:
          - artifact
          - commit

concurrency:
  group: update-baselines-${{ inputs.target_ref }}
  cancel-in-progress: true

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.target_ref }}
          persist-credentials: true

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4


      - name: Install dependencies
        run: bun install

      - name: Install client dependencies
        working-directory: client
        run: bun install

      - name: Regenerate baselines
        working-directory: client
        env:
          RACEIQ_CANONICAL_SNAPSHOT_ENV: "1"
        # snapshot = playwright test --update-snapshots && copy to assets/screenshots
        run: bun run snapshot

      - name: Upload generated baselines
        uses: actions/upload-artifact@v7
        with:
          name: canonical-storybook-baselines-${{ github.run_id }}
          path: |
            client/src/stories/__snapshots__/snapshot-*.png
            assets/screenshots/*.png
          if-no-files-found: error
          retention-days: 14

      - name: Commit regenerated baselines to target branch
        if: inputs.delivery == 'commit'
        env:
          TARGET_REF: ${{ inputs.target_ref }}
        shell: bash
        run: bun scripts/ui/commit-snapshot-baselines.ts
