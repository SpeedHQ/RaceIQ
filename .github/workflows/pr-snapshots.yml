name: Render dashboard snapshots

# Renders Storybook dashboard snapshots on pull requests that change the client
# and compares them against the committed baselines, then compares those
# baselines with each pull request's base branch. Any differences produce
# before/after/diff PNGs for the companion comment workflow.

# This workflow runs the PR's code, so it deliberately uses the read-only
# `pull_request` token — it never gets write access. All writes (comment,
# label, preview hosting) happen in the separate workflow_run job, which does
# NOT execute PR code.

on:
  workflow_call:
    inputs:
      pr:
        description: "Pull request number to render"
        required: true
        type: number
  # Manual dispatch remains available for any PR, including non-client changes.
  workflow_dispatch:
    inputs:
      pr:
        description: "PR number to render (merges its base into the PR head and comments on it)"
        required: true
        type: number

concurrency:
  group: pr-snapshots-${{ github.event.pull_request.number || inputs.pr }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: read

jobs:
  render:
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft
    runs-on:
      - whitesmith-windows-x64
      - 4VCPU
      - 15G
    container:
      image: mcr.microsoft.com/playwright:v1.62.0-jammy
    env:
      PR_NUMBER: ${{ github.event.pull_request.number || inputs.pr }}
    steps:
      - name: Resolve pull request revisions
        id: pull-request
        uses: actions/github-script@v9
        with:
          script: |
            const prNumber = Number(process.env.PR_NUMBER);
            const { data: pull } = await github.rest.pulls.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: prNumber,
            });
            core.setOutput("base-ref", pull.base.ref);
            core.setOutput("base-sha", pull.base.sha);

      - uses: actions/checkout@v7
        with:
          ref: refs/pull/${{ github.event.pull_request.number || inputs.pr }}/head
          fetch-depth: 0

      - name: Mark workspace safe for git (container runs as root)
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Merge pull request base into the PR head
        env:
          BASE_REF: ${{ steps.pull-request.outputs.base-ref }}
          BASE_SHA: ${{ steps.pull-request.outputs.base-sha }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git fetch --no-tags origin "+refs/heads/${BASE_REF}:refs/remotes/origin/${BASE_REF}"
          fetched_base_sha="$(git rev-parse --verify FETCH_HEAD)"
          if [ "$fetched_base_sha" != "$BASE_SHA" ]; then
            git fetch --no-tags origin "$BASE_SHA"
            fetched_base_sha="$(git rev-parse --verify FETCH_HEAD)"
          fi
          if [ "$fetched_base_sha" != "$BASE_SHA" ]; then
            echo "Fetched base commit $fetched_base_sha does not match $BASE_SHA" >&2
            exit 1
          fi
          git merge --no-edit "$BASE_SHA"

      - name: Prepare base comparison worktree
        env:
          BASE_SHA: ${{ steps.pull-request.outputs.base-sha }}
        run: git worktree add --detach "$RUNNER_TEMP/raceiq-base" "$BASE_SHA"

      - name: Install unzip (required by setup-bun in the container)
        run: apt-get update && apt-get install -y --no-install-recommends unzip

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Install dependencies
        run: bun install

      - name: Install client dependencies
        working-directory: client
        run: bun install

      - name: Render and compare against committed baselines
        id: storybook-render
        working-directory: client
        # This is the collaborator assertion: `snapshot:test` (no --update)
        # fails when the PR render differs from its committed snapshot.
        run: bun run snapshot:test
        # Keep running so the diff can be collected and posted as UI-change
        # awareness even when the collaborator assertion fails.
        continue-on-error: true

      - name: Collect diffs
        id: collect
        working-directory: client
        shell: bash
        run: |
          out="$GITHUB_WORKSPACE/pr-preview"
          mkdir -p "$out"
          echo "${{ github.event.pull_request.number || inputs.pr }}" > "$out/pr-number.txt"
          echo "${{ steps.pull-request.outputs.base-ref }}" > "$out/base-ref.txt"

          results="src/stories/__snapshots__/results"
          if [ -d "$results" ]; then
            while IFS= read -r diff; do
              dir=$(dirname "$diff")
              name=$(basename "$diff")
              name=${name%-diff.png}
              cp "$dir/$name-expected.png" "$out/changed--render-vs-committed-pr-baseline--$name-before.png" 2>/dev/null || continue
              cp "$dir/$name-actual.png"   "$out/changed--render-vs-committed-pr-baseline--$name-after.png"  2>/dev/null || continue
              cp "$dir/$name-diff.png"     "$out/changed--render-vs-committed-pr-baseline--$name-diff.png"   2>/dev/null || continue
              echo "changed rendered snapshot: $name"
            done < <(find "$results" -name '*-diff.png')
          fi

          bun "$GITHUB_WORKSPACE/scripts/ui/collect-screenshot-diffs.ts" \
            --base "$RUNNER_TEMP/raceiq-base/client/src/stories/__snapshots__" \
            --current "$GITHUB_WORKSPACE/client/src/stories/__snapshots__" \
            --out "$out" \
            --prefix committed-pr-baseline-vs-base

          if compgen -G "$out/*-after.png" >/dev/null; then
            echo "changed=1" >> "$GITHUB_OUTPUT"
          else
            echo "changed=0" >> "$GITHUB_OUTPUT"
          fi

      - name: Upload preview artifact
        uses: actions/upload-artifact@v7
        with:
          name: pr-screenshot-preview
          path: pr-preview/
          retention-days: 14

      - name: Fail when committed snapshots do not match
        if: steps.storybook-render.outcome == 'failure'
        run: |
          echo "::error::Committed Storybook snapshots do not match the current render. Run 'bun run snapshot:docker' from client/ to update them in the pinned renderer."
          exit 1
