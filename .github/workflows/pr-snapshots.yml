name: Render dashboard snapshots

# Renders Storybook dashboard snapshots on pull requests that change the client
# and compares them against the committed baselines, then compares those
# baselines with each pull request's base branch. Any differences produce
# before/after/diff PNGs for the companion comment workflow.

# This workflow runs the PR's code, so it deliberately uses the read-only
# `pull_request` token — it never gets write access. All writes (comment,
# label, preview hosting) happen in the separate workflow_run job, which does
# NOT execute PR code.

on:
  workflow_call:
    inputs:
      pr:
        description: "Pull request number to render"
        required: true
        type: number
  # Manual dispatch remains available for any PR, including non-client changes.
  workflow_dispatch:
    inputs:
      pr:
        description: "PR number to render (merges its base into the PR head and comments on it)"
        required: true
        type: number

concurrency:
  group: pr-snapshots-${{ github.event.pull_request.number || inputs.pr }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: read

jobs:
  render:
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft
    runs-on: ubuntu-latest
    env:
      PR_NUMBER: ${{ github.event.pull_request.number || inputs.pr }}
    steps:
      - name: Resolve pull request revisions
        id: pull-request
        uses: actions/github-script@v9
        with:
          script: |
            const prNumber = Number(process.env.PR_NUMBER);
            const { data: pull } = await github.rest.pulls.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: prNumber,
            });
            core.setOutput("base-ref", pull.base.ref);
            core.setOutput("base-sha", pull.base.sha);

      - uses: actions/checkout@v7
        with:
          ref: refs/pull/${{ github.event.pull_request.number || inputs.pr }}/head
          fetch-depth: 0

      - name: Merge pull request base into the PR head
        env:
          BASE_REF: ${{ steps.pull-request.outputs.base-ref }}
          BASE_SHA: ${{ steps.pull-request.outputs.base-sha }}
        shell: powershell
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git fetch --no-tags origin "refs/heads/$($env:BASE_REF):refs/remotes/origin/$($env:BASE_REF)"
          $fetchedBaseSha = git rev-parse --verify FETCH_HEAD
          if ($fetchedBaseSha -ne $env:BASE_SHA) {
            git fetch --no-tags origin $env:BASE_SHA
            $fetchedBaseSha = git rev-parse --verify FETCH_HEAD
          }
          if ($fetchedBaseSha -ne $env:BASE_SHA) {
            throw "Fetched base commit $fetchedBaseSha does not match $env:BASE_SHA"
          }
          git merge --no-edit $env:BASE_SHA


      - name: Prepare base comparison worktree
        env:
          BASE_SHA: ${{ steps.pull-request.outputs.base-sha }}
        run: git worktree add --detach "$env:RUNNER_TEMP/raceiq-base" "$env:BASE_SHA"

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4

      - name: Install dependencies
        run: bun install

      - name: Install client dependencies
        working-directory: client
        run: bun install
      - name: Pin Playwright Chromium
        working-directory: client
        run: bunx playwright install chromium


      - name: Render and compare against committed baselines
        id: storybook-render
        working-directory: client
        # This is the collaborator assertion: `snapshot:test` (no --update)
        # fails when the PR render differs from its committed snapshot.
        run: bun run snapshot:test
        # Keep running so the diff can be collected and posted as UI-change
        # awareness even when the collaborator assertion fails.
        continue-on-error: true

      - name: Collect diffs
        id: collect
        working-directory: client
        shell: powershell
        run: |
          $out = Join-Path $env:GITHUB_WORKSPACE "pr-preview"
          New-Item -ItemType Directory -Force -Path $out | Out-Null
          "${{ github.event.pull_request.number || inputs.pr }}" | Out-File (Join-Path $out "pr-number.txt") -Encoding utf8
          "${{ steps.pull-request.outputs.base-ref }}" | Out-File (Join-Path $out "base-ref.txt") -Encoding utf8

          $results = Join-Path (Get-Location) "src/stories/__snapshots__/results"
          if (Test-Path $results) {
            Get-ChildItem -Path $results -Filter "*-diff.png" -File -Recurse | ForEach-Object {
              $dir = $_.DirectoryName
              $name = $_.BaseName.Substring(0, $_.BaseName.Length - "-diff".Length)
              $before = Join-Path $dir "$name-expected.png"
              $after = Join-Path $dir "$name-actual.png"
              $diff = Join-Path $dir "$name-diff.png"
              if ((Test-Path $before) -and (Test-Path $after) -and (Test-Path $diff)) {
                Copy-Item $before (Join-Path $out "changed--render-vs-committed-pr-baseline--$name-before.png")
                Copy-Item $after (Join-Path $out "changed--render-vs-committed-pr-baseline--$name-after.png")
                Copy-Item $diff (Join-Path $out "changed--render-vs-committed-pr-baseline--$name-diff.png")
                Write-Host "changed rendered snapshot: $name"
              }
            }
          }

          bun "$env:GITHUB_WORKSPACE/scripts/ui/collect-screenshot-diffs.ts" `
            --base "$env:RUNNER_TEMP/raceiq-base/client/src/stories/__snapshots__" `
            --current "$env:GITHUB_WORKSPACE/client/src/stories/__snapshots__" `
            --out "$out" `
            --prefix committed-pr-baseline-vs-base

          if (Get-ChildItem -Path $out -Filter "*-after.png" -File -ErrorAction SilentlyContinue) {
            "changed=1" | Out-File $env:GITHUB_OUTPUT -Encoding utf8 -Append
          } else {
            "changed=0" | Out-File $env:GITHUB_OUTPUT -Encoding utf8 -Append
          }

      - name: Upload preview artifact
        uses: actions/upload-artifact@v7
        with:
          name: pr-screenshot-preview
          path: pr-preview/
          retention-days: 14

      - name: Fail when committed snapshots do not match
        if: steps.storybook-render.outcome == 'failure'
        run: |
          echo "::error::Committed Storybook snapshots do not match the current render. Run 'bun run snapshot:docker' from client/ to update them in the pinned renderer."
          exit 1
