name: Render dashboard snapshots

# Renders Storybook dashboard snapshots on pull requests that change the client
# and compares them against the committed baselines, then compares those
# baselines with each pull request's base branch. Any differences produce
# before/after/diff PNGs for the companion comment workflow.

# This workflow runs the PR's code, so it deliberately uses the read-only
# `pull_request` token — it never gets write access. All writes (comment,
# label, preview hosting) happen in the separate workflow_run job, which does
# NOT execute PR code.

on:
  workflow_call:
    inputs:
      pr:
        description: "Pull request number to render"
        required: true
        type: number
  # Manual dispatch remains available for any PR, including non-client changes.
  workflow_dispatch:
    inputs:
      pr:
        description: "PR number to render (merges its base into the PR head and comments on it)"
        required: true
        type: number

concurrency:
  group: pr-snapshots-${{ github.event.pull_request.number || inputs.pr }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: read

jobs:
  render:
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft
    runs-on:
      - mars-windows-x64
      - 4VCPU
      - 15G
    env:
      PR_NUMBER: ${{ github.event.pull_request.number || inputs.pr }}
    steps:
      - name: Resolve pull request revisions
        id: pull-request
        uses: actions/github-script@v9
        with:
          script: |
            const prNumber = Number(process.env.PR_NUMBER);
            const { data: pull } = await github.rest.pulls.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: prNumber,
            });
            core.setOutput("base-ref", pull.base.ref);
            core.setOutput("base-sha", pull.base.sha);

      - uses: actions/checkout@v7
        with:
          ref: refs/pull/${{ github.event.pull_request.number || inputs.pr }}/head
          fetch-depth: 0

      - name: Prepare merged PR snapshot workspace
        env:
          BASE_REF: ${{ steps.pull-request.outputs.base-ref }}
          BASE_SHA: ${{ steps.pull-request.outputs.base-sha }}
        shell: cmd
        run: bun scripts/ui/prepare-pr-snapshot.ts

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4

      - name: Install dependencies
        run: bun install

      - name: Install client dependencies
        working-directory: client
        run: bun install
      - name: Pin Playwright Chromium
        working-directory: client
        run: bunx playwright install chromium
      - name: Render and compare against committed baselines
        id: storybook-render
        working-directory: client
        # CI and baseline generation both use the Mars Windows renderer.
        run: bun run snapshot:test
        continue-on-error: true

        shell: cmd
        run: >
          bun "%GITHUB_WORKSPACE%/scripts/ui/prepare-pr-snapshot-preview.ts"
          "%GITHUB_WORKSPACE%/pr-preview"
          "%GITHUB_WORKSPACE%/client/src/stories/__snapshots__/results"
          "%RUNNER_TEMP%/raceiq-base/client/src/stories/__snapshots__"
          "%GITHUB_WORKSPACE%/client/src/stories/__snapshots__"
          "${{ github.event.pull_request.number || inputs.pr }}"
          "${{ steps.pull-request.outputs.base-ref }}"
          "%GITHUB_OUTPUT%"

      - name: Upload preview artifact
        uses: actions/upload-artifact@v7
        with:
          name: pr-screenshot-preview
          path: pr-preview/
          retention-days: 14

      - name: Fail when committed snapshots do not match
        if: steps.storybook-render.outcome == 'failure'
        run: |
          echo "::error::Committed Storybook snapshots do not match the current render. Run 'bun run snapshot' from client/ to update them in the CI renderer."
          exit 1
