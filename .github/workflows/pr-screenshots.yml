name: Render dashboard screenshots

# Renders responsive app screenshots on pull requests that change the client
# and compares them against each pull request's base branch. Any differences produce
# before/after/diff PNGs for the companion comment workflow.
#
# This workflow runs the PR's code, so it deliberately uses the read-only
# `pull_request` token — it never gets write access. All writes (comment,
# label, preview hosting) happen in the separate workflow_run job, which does
# NOT execute PR code.

on:
  workflow_call:
    inputs:
      pr:
        description: "Pull request number to render"
        required: true
        type: number
  # Manual dispatch remains available for any PR, including non-client changes.
  workflow_dispatch:
    inputs:
      pr:
        description: "PR number to render (merges its base into the PR head and comments on it)"
        required: true
        type: number

concurrency:
  group: pr-screenshots-${{ inputs.pr || github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: read

jobs:
  render:
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]
    runs-on:
      - mars-windows-x64
      - 4VCPU
      - 15G
    env:
      PR_NUMBER: ${{ inputs.pr || github.event.pull_request.number }}
    steps:
      # Resolve through the API for both event types. This keeps manual runs
      # aligned with the PR's current base revision too.
      - name: Resolve pull request revisions
        id: pull-request
        uses: actions/github-script@v9
        with:
          script: |
            const prNumber = Number(process.env.PR_NUMBER);
            const { data: pull } = await github.rest.pulls.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: prNumber,
            });
            core.setOutput("base-ref", pull.base.ref);
            core.setOutput("base-sha", pull.base.sha);

      # Check out the PR HEAD rather than GitHub's lazily updated merge ref,
      # then merge the resolved base revision ourselves.
      - uses: actions/checkout@v7
        with:
          ref: refs/pull/${{ github.event.pull_request.number || inputs.pr }}/head
          fetch-depth: 0

      - name: Mark workspace safe for git
        shell: powershell
        run: git config --global --add safe.directory "$env:GITHUB_WORKSPACE"

      - name: Merge pull request base into the PR head
        env:
          BASE_REF: ${{ steps.pull-request.outputs.base-ref }}
          BASE_SHA: ${{ steps.pull-request.outputs.base-sha }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git fetch --no-tags origin "+refs/heads/${env:BASE_REF}:refs/remotes/origin/${env:BASE_REF}"
          $fetchedBaseSha = (git rev-parse --verify FETCH_HEAD).Trim()
          if ($fetchedBaseSha -ne $env:BASE_SHA) {
            git fetch --no-tags origin "${env:BASE_SHA}"
            $fetchedBaseSha = (git rev-parse --verify FETCH_HEAD).Trim()
          }
          if ($fetchedBaseSha -ne $env:BASE_SHA) {
            throw "Fetched base commit ${fetchedBaseSha} does not match ${env:BASE_SHA}"
          }
          git merge --no-edit "${env:BASE_SHA}"

      - name: Prepare base comparison worktree
        env:
          BASE_SHA: ${{ steps.pull-request.outputs.base-sha }}
        run: git worktree add --detach "$env:RUNNER_TEMP/raceiq-base" "$env:BASE_SHA"


      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4
      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Install dependencies
        run: bun install

      - name: Install client dependencies
        working-directory: client
        run: bun install
      - name: Pin Playwright Chromium
        working-directory: playwright
        run: bunx playwright install chromium
      - name: Download current compiled artifact
        uses: actions/download-artifact@v7
        with:
          name: raceiq-dist-windows
          path: dist


      - name: Capture current responsive screenshots
        id: current-responsive
        continue-on-error: true
        env:
          E2E_SERVER_MODE: compiled
          PW_SCREENSHOT_WORKERS: "1"
          PW_SERVER_SET: seeded
          PW_SCREENSHOT_ONLY: "1"
          PW_SEED_SCREENSHOTS: "1"
        shell: powershell
        run: |
          Push-Location playwright
          $ErrorActionPreference = "Continue"
          & bun run ../scripts/playwright-ci.ts test --project=mobile-screenshots "--shard=${{ matrix.shard }}/2"
          $status = $LASTEXITCODE
          $ErrorActionPreference = "Stop"
          Pop-Location
          $output = Join-Path $env:RUNNER_TEMP "current-responsive"
          if (Test-Path "playwright/screenshots/mobile") {
            Remove-Item $output -Recurse -Force -ErrorAction SilentlyContinue
            Move-Item "playwright/screenshots/mobile" $output
          }
          exit $status

      - name: Capture base responsive screenshots with current tests
        id: base-responsive
        continue-on-error: true
        timeout-minutes: 15
        env:
          PW_SCREENSHOT_WORKERS: "1"
          E2E_SERVER_MODE: compiled
          PW_SERVER_SET: seeded
          PW_SCREENSHOT_ONLY: "1"
          PW_SEED_SCREENSHOTS: "1"
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"
          $base = Join-Path $env:RUNNER_TEMP "raceiq-base"
          if (-not (Test-Path -LiteralPath $base -PathType Container)) {
            throw "Base comparison worktree is missing: $base"
          }
          Push-Location $base
          bun install
          bun --env-file=.env.development run build
          Remove-Item (Join-Path $env:GITHUB_WORKSPACE "dist") -Recurse -Force -ErrorAction SilentlyContinue
          Copy-Item "dist" (Join-Path $env:GITHUB_WORKSPACE "dist") -Recurse -Force
          $basePlaywright = Join-Path $base "playwright"
          $currentScreenshotDir = Join-Path $env:GITHUB_WORKSPACE "playwright/screenshots/mobile"
          New-Item -ItemType Directory -Path $currentScreenshotDir -Force | Out-Null
          Set-Location $basePlaywright
          $env:RACEIQ_SCREENSHOT_DIR = $currentScreenshotDir
          $ErrorActionPreference = "Continue"
          & bun run ../scripts/playwright-ci.ts test --project=mobile-screenshots --grep=desktop "--shard=${{ matrix.shard }}/2"
          $status = $LASTEXITCODE
          $ErrorActionPreference = "Stop"
          $output = Join-Path $env:RUNNER_TEMP "base-responsive"
          if (Test-Path "screenshots/mobile") {
            Remove-Item $output -Recurse -Force -ErrorAction SilentlyContinue
            Move-Item "screenshots/mobile" $output
          }
          exit $status
      - name: Save shard render outputs
        if: always()
        shell: powershell
        run: |
          $artifact = Join-Path $env:RUNNER_TEMP "screenshot-render-${{ matrix.shard }}"
          New-Item -ItemType Directory -Path $artifact -Force | Out-Null
          foreach ($name in @("current-responsive", "base-responsive")) {
            $source = Join-Path $env:RUNNER_TEMP $name
            if (Test-Path $source) {
              Copy-Item $source (Join-Path $artifact $name) -Recurse -Force
            }
          }
          "${{ steps.current-responsive.outcome }}" | Set-Content (Join-Path $artifact "current-status.txt")
          "${{ steps.base-responsive.outcome }}" | Set-Content (Join-Path $artifact "base-status.txt")
          "${{ github.event.pull_request.number || inputs.pr }}" | Set-Content (Join-Path $artifact "pr-number.txt")
          "${{ steps.pull-request.outputs.base-ref }}" | Set-Content (Join-Path $artifact "base-ref.txt")

      - name: Upload shard render outputs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: pr-screenshot-render-${{ matrix.shard }}
          path: ${{ runner.temp }}/screenshot-render-${{ matrix.shard }}/
          retention-days: 14
      - name: Fail incomplete render shard
        if: always()
        shell: powershell
        run: |
          if ("${{ steps.current-responsive.outcome }}" -ne "success" -or
              "${{ steps.base-responsive.outcome }}" -ne "success") {
            Write-Error "Responsive screenshot shard incomplete."
            exit 1
          }


  collect:
    if: needs.render.result == 'success' && (github.event_name != 'pull_request' || !github.event.pull_request.draft)
    needs: render
    runs-on:
      - mars-windows-x64
      - 4VCPU
      - 15G
    steps:
      - uses: actions/checkout@v7
        with:
          ref: refs/pull/${{ github.event.pull_request.number || inputs.pr }}/head
          fetch-depth: 1

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4
      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Download shard render outputs
        uses: actions/download-artifact@v7
        with:
          pattern: pr-screenshot-render-*
          path: ${{ runner.temp }}/screenshot-renders
          merge-multiple: false

      - name: Collect responsive diffs
        id: collect
        shell: bash
        run: |
          set -euo pipefail
          current="$RUNNER_TEMP/current-responsive"
          base="$RUNNER_TEMP/base-responsive"
          mkdir -p "$current" "$base" pr-preview
          for shard in "$RUNNER_TEMP"/screenshot-renders/pr-screenshot-render-*; do
            [ -d "$shard" ] || continue
            [ -d "$shard/current-responsive" ] && cp -R "$shard/current-responsive/." "$current/"
            [ -d "$shard/base-responsive" ] && cp -R "$shard/base-responsive/." "$base/"
          done
          first_shard="$RUNNER_TEMP/screenshot-renders/pr-screenshot-render-1"
          cp "$first_shard/pr-number.txt" pr-preview/pr-number.txt
          cp "$first_shard/base-ref.txt" pr-preview/base-ref.txt
          bun scripts/ui/collect-screenshot-diffs.ts \
            --base "$base" \
            --current "$current" \
            --out "$GITHUB_WORKSPACE/pr-preview" \
            --prefix responsive

      - name: Upload preview artifact
        uses: actions/upload-artifact@v7
        with:
          name: pr-screenshot-preview
          path: pr-preview/
          retention-days: 14
