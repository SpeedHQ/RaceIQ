name: Build & Test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]

concurrency:
  group: build-test-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  build-test:
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft
    env:
      UPLOAD_E2E_ARTIFACT: ${{ github.event_name == 'pull_request' && !github.event.pull_request.draft }}
    # 4 vCPU: the ACC fixture replays peak ~4GB heap and GC-thrash on 2 vCPU, timing out.
    runs-on: 
      - whitesmith-windows-x64
      - 10VCPU
      - 10G

    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install

      - name: Lint server, shared, scripts, tests, and client
        run: bun run lint

      - name: Type-check server, shared, scripts, and tests
        run: bun run typecheck

      - name: Check changelog
        if: github.event_name == 'pull_request'
        run: |
          git fetch --no-tags --depth=1 origin "${{ github.base_ref }}"
          bun scripts/release/check-changelog.ts

      - name: Check generated telemetry catalog
        shell: powershell
        run: |
          if ("${{ github.event_name }}" -eq "pull_request") {
            $baseRef = "${{ github.base_ref }}"
            git fetch --no-tags --depth=1 origin "${baseRef}:refs/remotes/origin/${baseRef}"
            $baseline = Join-Path $env:RUNNER_TEMP "telemetry-catalog-baseline.json"
            $catalog = git show "origin/${baseRef}:shared/telemetry/catalog/generated/telemetry-catalog.generated.json" 2>$null
            if ($LASTEXITCODE -ne 0) {
              $catalog = git show "origin/${baseRef}:shared/telemetry-catalog.generated.json" 2>$null
            }
            if ($LASTEXITCODE -eq 0) {
              [System.IO.File]::WriteAllLines($baseline, [string[]]$catalog, [System.Text.UTF8Encoding]::new($false))
              bun run telemetry:catalog:check --baseline $baseline
            } else {
              Write-Output "Base branch has no telemetry catalog; checking current artifacts without a compatibility baseline."
              bun run telemetry:catalog:check
            }
          } else {
            bun run telemetry:catalog:check
          }

      - name: Build RaceIQ
        run: bun run build

      - name: Upload Windows E2E dist artifact
        if: env.UPLOAD_E2E_ARTIFACT == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: raceiq-dist-windows
          path: dist/
          retention-days: 1

      - name: Run tests
        run: bun run test

  playwright-dev:
    if: github.event_name == 'pull_request' && !github.event.pull_request.draft
    needs: build-test
    uses: ./.github/workflows/playwright-dev.yml

  screenshots:
    if: github.event_name == 'pull_request' && !github.event.pull_request.draft
    needs: build-test
    permissions:
      contents: read
      pull-requests: read
    uses: ./.github/workflows/pr-screenshots.yml
    with:
      pr: ${{ github.event.pull_request.number }}
  snapshots:
    if: github.event_name == 'pull_request' && !github.event.pull_request.draft
    needs: build-test
    permissions:
      contents: read
      pull-requests: read
    uses: ./.github/workflows/pr-snapshots.yml
    with:
      pr: ${{ github.event.pull_request.number }}
