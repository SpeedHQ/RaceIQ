name: Build & Test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]

  workflow_dispatch:
    inputs:
      target_ref:
        description: "Branch or ref to build and test"
        required: false
        type: string
      verification_mode:
        description: "Verification selection mode"
        type: choice
        options: [full, affected]
        default: full
      base_ref:
        description: "Base ref for affected mode"
        type: string
      head_ref:
        description: "Head ref for affected mode"
        type: string
concurrency:
  group: build-test-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true


jobs:
  build:
    timeout-minutes: 30
    if: (github.event_name != 'pull_request' || (!github.event.pull_request.draft && !startsWith(github.head_ref, 'release/v')))
    runs-on:
      - mars-ubuntu-2vcpu-6g
      - mars-retry-3
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.target_ref || inputs.head_ref || github.ref }}
          fetch-depth: 0

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build RaceIQ
        env:
          RACEIQ_FEATURE_F1_EXPERIMENTS: "true"
          RACEIQ_FEATURE_IRACING_ADAPTER: "true"
        run: bunx turbo run build

      - name: Upload compiled Paraglide artifact
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@v7
        with:
          name: raceiq-paraglide
          path: |
            client/src/paraglide
            client/project.inlang/.cache/raceiq-paraglide-build.json
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 1
        continue-on-error: true

  test:
    timeout-minutes: 30
    if: (github.event_name != 'pull_request' || (!github.event.pull_request.draft && !startsWith(github.head_ref, 'release/v')))
    runs-on:
      - mars-ubuntu-2vcpu-6g
      - mars-retry-3
    env:
      BUN_TEST_WORKERS: "1"
      TURBO_SCM_BASE: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || (github.event_name == 'push' && (github.event.before != '0000000000000000000000000000000000000000' && github.event.before || 'origin/main')) || inputs.base_ref }}
      TURBO_SCM_HEAD: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || (github.event_name == 'push' && github.sha) || inputs.head_ref }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.target_ref || inputs.head_ref || github.ref }}
          fetch-depth: 0
      - name: Validate manual affected checkout
        if: github.event_name == 'workflow_dispatch' && inputs.verification_mode == 'affected'
        env:
          REQUESTED_HEAD: ${{ inputs.head_ref }}
        run: |
          resolved=$(git rev-parse --verify --end-of-options "${REQUESTED_HEAD}^{commit}" 2>/dev/null) || resolved=
          current=$(git rev-parse HEAD)
          if [ -z "$resolved" ] || [ "$resolved" != "$current" ]; then
            echo "Manual head is missing, invalid, or differs from checkout; selecting full tasks."
            echo "TURBO_SCM_HEAD=" >> "$GITHUB_ENV"
          fi

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Restore Turbo task cache
        uses: actions/cache/restore@v4
        with:
          path: .turbo/cache
          key: turbo-${{ runner.os }}-${{ runner.arch }}-bun-1.4.4-turbo-2.11.7-${{ github.sha }}-${{ github.run_attempt }}
          restore-keys: |
            turbo-${{ runner.os }}-${{ runner.arch }}-bun-1.4.4-turbo-2.11.7-

      - name: Check test shard coverage
        run: bun run test:shards

      - name: Check locale message keys
        run: bun run i18n:check-keys

      - name: Lint server, shared, scripts, tests, and client
        run: |
          if [ "$FULL" = true ]; then
            bun scripts/test/run-turbo.ts lint
          else
            bun scripts/test/run-turbo.ts lint --affected
          fi
        env:
          FULL: ${{ github.event_name == 'workflow_dispatch' && inputs.verification_mode != 'affected' }}

      - name: Type-check server, shared, scripts, and tests
        run: |
          if [ "$FULL" = true ]; then
            bun scripts/test/run-turbo.ts typecheck --concurrency=1
          else
            bun scripts/test/run-turbo.ts typecheck --affected --concurrency=1
          fi
        env:
          FULL: ${{ github.event_name == 'workflow_dispatch' && inputs.verification_mode != 'affected' }}
      - name: Verify seeded database upgrade
        if: github.event_name == 'pull_request' && !github.event.pull_request.draft
        env:
          UPGRADE_DATA_DIR: ${{ runner.temp }}/raceiq-upgrade-data
        run: bun scripts/ci/check-db-upgrade.ts


      - name: Check generated telemetry catalog
        run: bun scripts/ci/check-telemetry-catalog.ts
      - name: Run affected unit tests
        env:
          TURBO_SCM_BASE: ${{ github.event.pull_request.base.sha }}
          TURBO_SCM_HEAD: ${{ github.event.pull_request.head.sha }}
        run: bun scripts/test/run-turbo.ts test:unit --affected --log-order=stream --concurrency=2
        if: github.event_name == 'pull_request'
      - name: Run affected tooling tests
        env:
          TURBO_SCM_BASE: ${{ github.event.pull_request.base.sha }}
          TURBO_SCM_HEAD: ${{ github.event.pull_request.head.sha }}
        run: bun scripts/test/run-turbo.ts test:tooling --affected --log-order=stream --concurrency=2
        if: github.event_name == 'pull_request'
      - name: Run affected integration tests
        env:
          TURBO_SCM_BASE: ${{ github.event.pull_request.base.sha }}
          TURBO_SCM_HEAD: ${{ github.event.pull_request.head.sha }}
        run: bun scripts/test/run-turbo.ts test:integration --affected --log-order=stream --concurrency=2
        if: github.event_name == 'pull_request'
      - name: Run full test suites
        run: bun scripts/test/run-turbo.ts test:unit test:tooling test:integration --concurrency=2
        if: github.event_name != 'pull_request' && (github.event_name != 'workflow_dispatch' || inputs.verification_mode != 'affected')
      - name: Run manually selected affected test suites
        if: github.event_name == 'workflow_dispatch' && inputs.verification_mode == 'affected'
        run: bun scripts/test/run-turbo.ts test:unit test:tooling test:integration --affected --concurrency=2
      - name: Save Turbo task cache
        uses: actions/cache/save@v4
        with:
          path: .turbo/cache
          key: turbo-${{ runner.os }}-${{ runner.arch }}-bun-1.4.4-turbo-2.11.7-${{ github.sha }}-${{ github.run_attempt }}
        if: always()



  changelog:
    timeout-minutes: 30
    if: github.event_name == 'pull_request' && !startsWith(github.head_ref, 'release/v')
    runs-on: ubuntu-slim
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 1
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
      - name: Install workspace dependencies
        run: bun install --frozen-lockfile --ignore-scripts
      - name: Check changelog
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          git fetch --no-tags --depth=1 origin "$BASE_REF"
          bun packages/tooling-release/src/release/check-changelog.ts
  # Playwright runners span architectures; build the compiled server on each runner
  # instead of sharing a dist artifact built for an arbitrary build-runner architecture.
  playwright-e2e:
    if: (github.event_name == 'pull_request' && !github.event.pull_request.draft && !startsWith(github.head_ref, 'release/v')) || github.event_name == 'workflow_dispatch'
    needs:
      - build
      - test
    uses: ./.github/workflows/playwright-e2e.yml
    with:
      target-ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || (inputs.target_ref || inputs.head_ref || github.ref) }}
      paraglide-artifact: ${{ github.event_name == 'pull_request' && 'raceiq-paraglide' || '' }}
      verification-mode: ${{ github.event_name == 'pull_request' && 'affected' || (inputs.verification_mode || 'full') }}
      base-ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || inputs.base_ref }}
      head-ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || inputs.head_ref }}

  visual-regression:
    name: visual-regression/compare
    if: github.event_name == 'pull_request' && !github.event.pull_request.draft && !startsWith(github.head_ref, 'release/v')
    needs:
      - build
      - test
    permissions:
      contents: read
      pull-requests: read
    uses: ./.github/workflows/pr-visuals.yml
    with:
      pr: ${{ github.event.pull_request.number }}
      paraglide-artifact: raceiq-paraglide
      verification-mode: affected
      base-ref: ${{ github.event.pull_request.base.sha }}
      head-ref: ${{ github.event.pull_request.head.sha }}
