name: Build & Test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]

  workflow_dispatch:
    inputs:
      target_ref:
        description: "Branch or ref to build and test"
        required: false
        type: string
concurrency:
  group: build-test-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true


jobs:
  build:
    timeout-minutes: 30
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft
    runs-on:
      - mars-windows-x64-10vcpu-15g
      - mars-macos-arm64-2vcpu-10g
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.target_ref || github.ref }}

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4

      - name: Install dependencies
        run: bun install

      - name: Build RaceIQ
        run: bun run build

      - name: Upload Windows E2E dist artifact
        uses: actions/upload-artifact@v7
        with:
          name: raceiq-dist-windows
          path: dist/
          if-no-files-found: error
          retention-days: 1

  test:
    timeout-minutes: 30
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft
    runs-on:
      - mars-windows-x64-10vcpu-15g
      - mars-macos-arm64-2vcpu-10g
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.target_ref || github.ref }}

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4

      - name: Install dependencies
        run: bun install

      - name: Check test shard coverage
        run: bun run test:shards

      - name: Lint server, shared, scripts, tests, and client
        run: bun run lint

      - name: Type-check server, shared, scripts, and tests
        run: bun run typecheck

      - name: Check generated telemetry catalog
        run: bun scripts/ci/check-telemetry-catalog.ts

      - name: Run unit tests
        run: bun run test:unit

      - name: Run toolchain tests
        run: bun run test:tooling

      - name: Run integration tests
        run: bun run test:integration

  db-upgrade:
    name: database/upgrade
    timeout-minutes: 10
    if: github.event_name == 'pull_request' && !github.event.pull_request.draft
    runs-on:
      - mars-windows-x64-2vcpu-5g
      - mars-macos-arm64-2vcpu-5g
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.target_ref || github.ref }}

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4

      - name: Install PR dependencies
        run: bun install

      - name: Verify seeded database upgrade
        env:
          RACEIQ_DB_UPGRADE_TESTS: "1"
          UPGRADE_DATA_DIR: ${{ runner.temp }}/raceiq-upgrade-data
        run: |
          git fetch --no-tags --depth=1 origin "${{ github.base_ref }}"
          if git diff --quiet "origin/${{ github.base_ref }}" -- server/db/migrations.ts; then
            echo "No migration script changes; skipping seeded upgrade test."
            exit 0
          fi
          BASE_DIR="${RUNNER_TEMP}/raceiq-base"
          git worktree add --detach "$BASE_DIR" "origin/${{ github.base_ref }}"
          trap 'git worktree remove --force "$BASE_DIR"' EXIT
          (cd "$BASE_DIR" && bun install --frozen-lockfile && DATA_DIR="$UPGRADE_DATA_DIR" bun run db:seed --clean --games=iracing)
          RACEIQ_UPGRADE_DATA_DIR="$UPGRADE_DATA_DIR" bun test ./test/db/database-path.test.ts --timeout 120000

  changelog:
    timeout-minutes: 30
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 1
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4
      - name: Check changelog
        run: |
          git fetch --no-tags --depth=1 origin "${{ github.base_ref }}"
          bun scripts/release/check-changelog.ts
  playwright-e2e:
    if: >-
      always() &&
      github.event_name == 'pull_request' &&
      !github.event.pull_request.draft &&
      needs.snapshots.result == 'success'
    needs:
      - snapshots
    uses: ./.github/workflows/playwright-e2e.yml
    with:
      target-ref: ${{ inputs.target_ref || github.ref }}

  screenshots:
    if: github.event_name == 'pull_request' && !github.event.pull_request.draft
    needs:
      - build
      - test
    permissions:
      contents: read
      pull-requests: read
    uses: ./.github/workflows/pr-screenshots.yml
    with:
      pr: ${{ github.event.pull_request.number }}
  snapshots:
    name: snapshots/compare
    if: github.event_name == 'pull_request' && !github.event.pull_request.draft
    needs:
      - build
      - test
    permissions:
      contents: read
      pull-requests: read
    uses: ./.github/workflows/pr-snapshots.yml
    with:
      pr: ${{ github.event.pull_request.number }}
