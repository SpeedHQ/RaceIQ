name: Build & Test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]

  workflow_dispatch:
    inputs:
      target_ref:
        description: "Branch or ref to build and test"
        required: false
        type: string
concurrency:
  group: build-test-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true


jobs:
  build:
    timeout-minutes: 30
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft
    runs-on:
      - mars-windows-x64-10vcpu-15g
      - mars-retry-3
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.target_ref || github.ref }}
          fetch-depth: 0

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build RaceIQ
        run: bun run build

      - name: Upload compiled Paraglide artifact
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@v7
        with:
          name: raceiq-paraglide
          path: |
            client/src/paraglide
            client/project.inlang/.cache/raceiq-paraglide-build.json
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 1
        continue-on-error: true

      - name: Upload Windows E2E dist artifact
        uses: actions/upload-artifact@v7
        with:
          name: raceiq-dist-windows
          path: dist/
          if-no-files-found: error
          retention-days: 1

  test:
    timeout-minutes: 30
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft
    runs-on:
      - mars-windows-x64-10vcpu-25g
      - mars-macos-arm64-2vcpu-10g
      - mars-ubuntu-arm64-2vcpu-10g
      - mars-retry-3
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.target_ref || github.ref }}
          fetch-depth: 0

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Restore Turbo task cache
        uses: actions/cache/restore@v4
        with:
          path: .turbo/cache
          key: turbo-${{ runner.os }}-${{ runner.arch }}-bun-1.4.2-turbo-2.11.7-${{ github.sha }}-${{ github.run_attempt }}
          restore-keys: |
            turbo-${{ runner.os }}-${{ runner.arch }}-bun-1.4.2-turbo-2.11.7-

      - name: Check test shard coverage
        run: bun run test:shards

      - name: Check locale message keys
        run: bun run i18n:check-keys

      - name: Lint server, shared, scripts, tests, and client
        run: bun run lint

      - name: Type-check server, shared, scripts, and tests
        run: bun run typecheck
      - name: Verify seeded database upgrade
        if: github.event_name == 'pull_request' && !github.event.pull_request.draft
        env:
          UPGRADE_DATA_DIR: ${{ runner.temp }}/raceiq-upgrade-data
        run: bun scripts/ci/check-db-upgrade.ts


      - name: Check generated telemetry catalog
        run: bun scripts/ci/check-telemetry-catalog.ts
      - name: Run affected test suites
        env:
          TURBO_SCM_BASE: ${{ github.event.pull_request.base.sha }}
          TURBO_SCM_HEAD: ${{ github.event.pull_request.head.sha }}
        run: bun scripts/test/run-turbo.ts test:unit test:tooling test:integration --affected
        if: github.event_name == 'pull_request'
      - name: Run full test suites
        run: bun scripts/test/run-turbo.ts test:unit test:tooling test:integration
        if: github.event_name != 'pull_request'
      - name: Save Turbo task cache
        uses: actions/cache/save@v4
        with:
          path: .turbo/cache
          key: turbo-${{ runner.os }}-${{ runner.arch }}-bun-1.4.2-turbo-2.11.7-${{ github.sha }}-${{ github.run_attempt }}
        if: always()



  changelog:
    timeout-minutes: 30
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-slim
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 1
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4
      - name: Install workspace dependencies
        run: bun install --frozen-lockfile --ignore-scripts
      - name: Check changelog
        run: |
          git fetch --no-tags --depth=1 origin "${{ github.base_ref }}"
          bun packages/tooling-release/src/release/check-changelog.ts
  playwright-e2e:
    if: github.event_name == 'pull_request' && !github.event.pull_request.draft
    needs:
      - build
      - test
    uses: ./.github/workflows/playwright-e2e.yml
    with:
      target-ref: ${{ inputs.target_ref || github.ref }}
      paraglide-artifact: raceiq-paraglide

  screenshots:
    if: github.event_name == 'pull_request' && !github.event.pull_request.draft
    needs:
      - build
      - test
    permissions:
      contents: read
      pull-requests: read
    uses: ./.github/workflows/pr-screenshots.yml
    with:
      pr: ${{ github.event.pull_request.number }}
  snapshots:
    name: snapshots/compare
    if: github.event_name == 'pull_request' && !github.event.pull_request.draft
    needs:
      - build
      - test
    permissions:
      contents: read
      pull-requests: read
    uses: ./.github/workflows/pr-snapshots.yml
    with:
      pr: ${{ github.event.pull_request.number }}
      paraglide-artifact: raceiq-paraglide
