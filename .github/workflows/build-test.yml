name: Build & Test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]

  workflow_dispatch:
    inputs:
      target_ref:
        description: "Branch or ref to build and test"
        required: false
        type: string
      verification_mode:
        description: "Verification selection mode"
        type: choice
        options: [full, affected]
        default: full
      base_ref:
        description: "Base ref for affected mode"
        type: string
      head_ref:
        description: "Head ref for affected mode"
        type: string
concurrency:
  group: build-test-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true


jobs:
  plan:
    name: Select verification jobs
    if: github.event_name != 'pull_request' || (!github.event.pull_request.draft && !startsWith(github.head_ref, 'release/v'))
    runs-on: ubuntu-slim
    timeout-minutes: 15
    outputs:
      verification: ${{ steps.select.outputs.plan }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha || inputs.target_ref || inputs.head_ref || github.sha }}
          fetch-depth: 0
          filter: blob:none
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
      - run: bun install --frozen-lockfile --ignore-scripts
      - name: Select verification jobs
        id: select
        env:
          MODE: ${{ (github.event_name == 'pull_request' || inputs.verification_mode == 'affected') && 'affected' || 'full' }}
          SCOPE: ${{ github.event_name == 'pull_request' && 'pr' || 'non-pr' }}
          BASE: ${{ github.event.pull_request.base.sha || inputs.base_ref }}
          HEAD: ${{ github.event.pull_request.head.sha || inputs.head_ref }}
        run: bun scripts/ci/affected-verification.ts --mode "$MODE" --scope "$SCOPE" --base "$BASE" --head "$HEAD"

  verification:
    name: Verification
    if: always()
    needs: [plan, build, macos-desktop, test, changelog, playwright-e2e, visual-regression]
    runs-on: ubuntu-slim
    timeout-minutes: 5
    steps:
      - name: Reject cancelled workflow
        if: cancelled()
        run: exit 1
      - name: Verify selected job conclusions
        if: ${{ !cancelled() }}
        env:
          PLAN: ${{ needs.plan.outputs.verification }}
          RESULTS: ${{ toJSON(needs) }}
          ELIGIBLE: ${{ github.event_name != 'pull_request' || (!github.event.pull_request.draft && !startsWith(github.head_ref, 'release/v')) }}
          CHANGELOG: ${{ github.event_name == 'pull_request' && !startsWith(github.head_ref, 'release/v') }}
        uses: actions/github-script@v9
        with:
          script: |
            const results = JSON.parse(process.env.RESULTS);
            const eligible = process.env.ELIGIBLE === "true";
            const expected = eligible ? JSON.parse(process.env.PLAN).expected : {
              build: false, "macos-desktop": false, test: false,
              changelog: process.env.CHANGELOG === "true",
              "playwright-e2e": false, "visual-regression": false,
            };
            if (results.plan.result !== (eligible ? "success" : "skipped")) throw new Error("Verification planning did not complete as expected");
            const jobs = Object.keys(results).filter(name => name !== "plan");
            if (!expected || Object.keys(expected).length !== jobs.length) throw new Error("Invalid expected job inventory");
            const failures = jobs.flatMap(name => {
              if (typeof expected[name] !== "boolean") throw new Error(`Missing expected result: ${name}`);
              const wanted = expected[name] ? "success" : "skipped";
              return results[name].result === wanted ? [] : [`${name}: expected ${wanted}, got ${results[name].result}`];
            });
            if (failures.length) throw new Error(failures.join("\n"));

  build:
    timeout-minutes: 30
    needs: plan
    if: fromJSON(needs.plan.outputs.verification).build
    runs-on:
      - mars-ubuntu-2vcpu-4gmem
      - mars-retry-3
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ fromJSON(needs.plan.outputs.verification).head }}
          fetch-depth: 0
          # Exclude unused LMU recordings. Sparse checkout enables blob:none; an explicit filter overrides it.
          sparse-checkout: |
            /*
            !/packages/game-lmu/test/fixtures/laps/
          sparse-checkout-cone-mode: false

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build RaceIQ
        env:
          RACEIQ_FEATURE_F1_EXPERIMENTS: "true"
          RACEIQ_FEATURE_IRACING_ADAPTER: "true"
        run: bunx turbo run build

      - name: Upload compiled Paraglide artifact
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@v7
        with:
          name: raceiq-paraglide
          path: |
            client/src/paraglide
            client/project.inlang/.cache/raceiq-paraglide-build.json
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 1
        continue-on-error: true

  macos-desktop:
    name: macOS desktop
    timeout-minutes: 45
    needs: plan
    if: fromJSON(needs.plan.outputs.verification).desktop
    runs-on: mars-macos-2vcpu-6g
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ fromJSON(needs.plan.outputs.verification).head }}
          fetch-depth: 0
          # Exclude unused LMU recordings. Sparse checkout enables blob:none; an explicit filter overrides it.
          sparse-checkout: |
            /*
            !/packages/game-lmu/test/fixtures/laps/
          sparse-checkout-cone-mode: false

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4

      - uses: dtolnay/rust-toolchain@stable

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # The Tauri build generates dist/, which the native host tests require as a bundle resource.
      - name: Build macOS desktop app
        run: bun run desktop:build

      - name: Test native host
        run: cargo test --manifest-path apps/desktop/src-tauri/Cargo.toml

  test:
    timeout-minutes: 30
    needs: plan
    runs-on:
      - mars-ubuntu-2vcpu-8g
      - mars-retry-3
    env:
      BUN_TEST_WORKERS: "1"
      TURBO_SCM_BASE: ${{ github.event_name == 'push' && (github.event.before != '0000000000000000000000000000000000000000' && github.event.before || 'origin/main') || fromJSON(needs.plan.outputs.verification).base }}
      TURBO_SCM_HEAD: ${{ fromJSON(needs.plan.outputs.verification).head }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ fromJSON(needs.plan.outputs.verification).head }}
          fetch-depth: 0
          filter: blob:none
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Restore Turbo task cache
        uses: actions/cache/restore@v4
        with:
          path: .turbo/cache
          key: turbo-${{ runner.os }}-${{ runner.arch }}-bun-1.4.4-turbo-2.11.7-${{ github.sha }}-${{ github.run_attempt }}
          restore-keys: |
            turbo-${{ runner.os }}-${{ runner.arch }}-bun-1.4.4-turbo-2.11.7-

      - name: Check test shard coverage
        if: fromJSON(needs.plan.outputs.verification).checks.shards
        run: bun run --cwd playwright ci:check-shards

      - name: Check locale message keys
        if: fromJSON(needs.plan.outputs.verification).checks.locales
        run: bun run --cwd playwright ci:check-locales

      - name: Lint server, shared, scripts, tests, and client
        run: |
          if [ "$FULL" = true ]; then
            bun scripts/test/run-turbo.ts lint
          else
            bun scripts/test/run-turbo.ts lint --affected
          fi
        env:
          FULL: ${{ github.event_name == 'workflow_dispatch' && inputs.verification_mode != 'affected' }}

      - name: Type-check server, shared, scripts, and tests
        run: |
          if [ "$FULL" = true ]; then
            bun scripts/test/run-turbo.ts typecheck --concurrency=1
          else
            bun scripts/test/run-turbo.ts typecheck --affected --concurrency=1
          fi
        env:
          FULL: ${{ github.event_name == 'workflow_dispatch' && inputs.verification_mode != 'affected' }}
      - name: Verify seeded database upgrade
        if: fromJSON(needs.plan.outputs.verification).checks.dbUpgrade
        env:
          UPGRADE_DATA_DIR: ${{ runner.temp }}/raceiq-upgrade-data
        run: bun run --cwd playwright ci:check-db-upgrade


      - name: Check generated telemetry catalog
        if: fromJSON(needs.plan.outputs.verification).checks.telemetry
        run: bun run --cwd playwright ci:check-telemetry
      - name: Run affected unit tests
        run: bun scripts/test/run-turbo.ts test:unit --affected --log-order=stream --concurrency=2
        if: github.event_name == 'pull_request'
      - name: Run affected tooling tests
        run: bun scripts/test/run-turbo.ts test:tooling --affected --log-order=stream --concurrency=2
        if: github.event_name == 'pull_request'
      - name: Run affected integration tests
        run: bun scripts/test/run-turbo.ts test:integration --affected --log-order=stream --concurrency=2
        if: github.event_name == 'pull_request'
      - name: Run full test suites
        run: bun scripts/test/run-turbo.ts test:unit test:tooling test:integration --concurrency=2
        if: github.event_name != 'pull_request' && (github.event_name != 'workflow_dispatch' || inputs.verification_mode != 'affected')
      - name: Run manually selected affected test suites
        if: github.event_name == 'workflow_dispatch' && inputs.verification_mode == 'affected'
        run: bun scripts/test/run-turbo.ts test:unit test:tooling test:integration --affected --concurrency=2
      - name: Save Turbo task cache
        uses: actions/cache/save@v4
        with:
          path: .turbo/cache
          key: turbo-${{ runner.os }}-${{ runner.arch }}-bun-1.4.4-turbo-2.11.7-${{ github.sha }}-${{ github.run_attempt }}
        if: always()



  changelog:
    timeout-minutes: 30
    if: github.event_name == 'pull_request' && !github.event.pull_request.draft && !startsWith(github.head_ref, 'release/v')
    runs-on: ubuntu-slim
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          # Exclude unused LMU recordings. Sparse checkout enables blob:none; an explicit filter overrides it.
          sparse-checkout: |
            /*
            !/packages/game-lmu/test/fixtures/laps/
          sparse-checkout-cone-mode: false
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
      - name: Install workspace dependencies
        run: bun install --frozen-lockfile --ignore-scripts
      - name: Check changelog
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          git fetch --no-tags --depth=1 origin "$BASE_REF:refs/remotes/origin/$BASE_REF"
          bun packages/tooling-release/src/release/check-changelog.ts
  # Playwright runners span architectures; build the compiled server on each runner
  # instead of sharing a dist artifact built for an arbitrary build-runner architecture.
  playwright-e2e:
    if: ${{ !cancelled() && needs.plan.result == 'success' && needs.test.result == 'success' && (needs.build.result == 'success' || needs.build.result == 'skipped') && fromJSON(needs.plan.outputs.verification).expected['playwright-e2e'] }}
    needs: [plan, build, test]
    uses: ./.github/workflows/playwright-e2e.yml
    with:
      target-ref: ${{ fromJSON(needs.plan.outputs.verification).head }}
      paraglide-artifact: ${{ fromJSON(needs.plan.outputs.verification).artifacts.paraglide }}
      verification-plan: ${{ toJSON(fromJSON(needs.plan.outputs.verification).browser) }}

  visual-regression:
    name: visual-regression/compare
    if: ${{ !cancelled() && needs.plan.result == 'success' && needs.test.result == 'success' && (needs.build.result == 'success' || needs.build.result == 'skipped') && fromJSON(needs.plan.outputs.verification).expected['visual-regression'] }}
    needs: [plan, build, test]
    permissions:
      contents: read
      pull-requests: read
    uses: ./.github/workflows/pr-visuals.yml
    with:
      pr: ${{ github.event.pull_request.number }}
      paraglide-artifact: ${{ fromJSON(needs.plan.outputs.verification).artifacts.paraglide }}
      head-ref: ${{ fromJSON(needs.plan.outputs.verification).head }}
      base-ref: ${{ github.event.pull_request.base.sha }}
      responsive: ${{ fromJSON(needs.plan.outputs.verification).responsive }}
      storybook: ${{ fromJSON(needs.plan.outputs.verification).storybook }}
