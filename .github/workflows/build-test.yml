name: Build & Test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]

concurrency:
  group: build-test-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  build-test:
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft
    # 4 vCPU: the ACC fixture replays peak ~4GB heap and GC-thrash on 2 vCPU, timing out.
    runs-on: blacksmith-4vcpu-ubuntu-2204

    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install

      - name: Lint server, shared, scripts, tests, and client
        run: bun run lint

      - name: Type-check server, shared, scripts, and tests
        run: bun run typecheck

      - name: Check changelog
        if: github.event_name == 'pull_request'
        run: |
          git fetch --no-tags --depth=1 origin "${{ github.base_ref }}"
          bun scripts/release/check-changelog.ts

      - name: Check generated telemetry catalog
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            git fetch --no-tags --depth=1 origin "${{ github.base_ref }}:refs/remotes/origin/${{ github.base_ref }}"
            baseline="$RUNNER_TEMP/telemetry-catalog-baseline.json"
            if git show "origin/${{ github.base_ref }}:shared/telemetry/catalog/generated/telemetry-catalog.generated.json" > "$baseline" 2>/dev/null \
              || git show "origin/${{ github.base_ref }}:shared/telemetry-catalog.generated.json" > "$baseline" 2>/dev/null; then
              bun run telemetry:catalog:check --baseline "$baseline"
            else
              echo "Base branch has no telemetry catalog; checking current artifacts without a compatibility baseline."
              bun run telemetry:catalog:check
            fi
          else
            bun run telemetry:catalog:check
          fi

      - name: Build RaceIQ
        run: bun run build

      - name: Run tests
        run: bun run test

  e2e-windows-build:
    if: github.event_name == 'pull_request' && !github.event.pull_request.draft
    runs-on: whitesmith-windows-x64
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build RaceIQ for Windows E2E
        run: bun run build

      - name: Upload Windows dist artifact
        uses: actions/upload-artifact@v4
        with:
          name: raceiq-dist-windows
          path: dist/
          retention-days: 1

  playwright-dev:
    if: github.event_name == 'pull_request' && !github.event.pull_request.draft
    needs: [build-test, e2e-windows-build]
    uses: ./.github/workflows/playwright-dev.yml
