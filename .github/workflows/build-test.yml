name: Build & Test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]

jobs:
  build-test:
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft
    # 4 vCPU: the ACC fixture replays peak ~4GB heap and GC-thrash on 2 vCPU, timing out.
    runs-on: blacksmith-4vcpu-ubuntu-2204

    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install

      - name: Check changelog
        if: github.event_name == 'pull_request'
        run: |
          git fetch --no-tags --depth=1 origin "${{ github.base_ref }}"
          bun scripts/check-changelog.ts

      - name: Check generated telemetry catalog
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            git fetch --no-tags --depth=1 origin "${{ github.base_ref }}:refs/remotes/origin/${{ github.base_ref }}"
            git show "origin/${{ github.base_ref }}:shared/telemetry/catalog/generated/telemetry-catalog.generated.json" > "$RUNNER_TEMP/telemetry-catalog-baseline.json" \
              || git show "origin/${{ github.base_ref }}:shared/telemetry-catalog.generated.json" > "$RUNNER_TEMP/telemetry-catalog-baseline.json"
            bun run telemetry:catalog:check --baseline "$RUNNER_TEMP/telemetry-catalog-baseline.json"
          else
            bun run telemetry:catalog:check
          fi

      - name: Build client
        run: cd client && bun install && bun run build

      - name: Run tests
        run: bun run test

  playwright-dev:
    if: github.event_name == 'pull_request' && !github.event.pull_request.draft
    needs: build-test
    uses: ./.github/workflows/playwright-dev.yml
