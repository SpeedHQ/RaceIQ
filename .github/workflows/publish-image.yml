name: Publish Docker Image

on:
  workflow_call:
    inputs:
      release_tag:
        description: Published release tag
        required: true
        type: string
      source_ref:
        description: Ref to build
        required: false
        type: string
        default: ""
      publish_latest:
        description: Also move latest tag
        required: false
        type: boolean
        default: true
  workflow_dispatch:
    inputs:
      release_tag:
        description: Image version tag, for example 0.0.1
        required: true
        type: string
      source_ref:
        description: Branch or ref to build
        required: true
        type: string
        default: main
      publish_latest:
        description: Also move latest tag
        required: true
        type: boolean
        default: false

permissions:
  contents: read
  packages: write
jobs:
  publish:
    timeout-minutes: 30
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.source_ref || inputs.release_tag }}

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/speedhq/raceiq
          flavor: latest=${{ inputs.publish_latest }}
          tags: |
            type=semver,pattern={{version}},value=${{ inputs.release_tag }}
            type=raw,value=latest,enable=${{ inputs.publish_latest }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          annotations: |
            type=manifest,org.opencontainers.image.description=RaceIQ Linux container for telemetry dashboards, lap analysis, catalogue, imports, and UDP telemetry.
          build-args: |
            RELEASE_VERSION=${{ inputs.release_tag }}
