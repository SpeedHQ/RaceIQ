name: Playwright E2E

on:
  workflow_call:
    inputs:
      server-mode:
        description: "Playwright server mode: dev or compiled"
        required: false
        type: string
        default: compiled
      runs-on:
        description: "Runner labels as JSON array; Windows is required for compiled native binary"
        required: false
        type: string
        default: '["whitesmith-windows-x64", "4VCPU", "5G"]'
      projects:
        description: "Playwright project flags passed to the gate"
        required: false
        type: string
        default: "--project=fresh-install --project=tunes --project=seeded-e2e --project=seeded-imports --project=mobile-device --project=tablet-device"
      server-set:
        description: "Playwright server set: all, fresh, tunes, or seeded"
        required: false
        type: string
        default: all
      dist-artifact:
        description: "Optional prebuilt dist artifact for compiled-server gate"
        required: false
        type: string
        default: ""
      artifact-name:
        description: "Trace and test-result artifact name"
        required: false
        type: string
        default: playwright-results
      diagnostic-artifact-name:
        description: "Server diagnostic artifact name"
        required: false
        type: string
        default: server-diagnostics

jobs:
  playwright:
    runs-on: ${{ fromJSON(inputs.runs-on) }}
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Download dist artifact
        if: inputs.dist-artifact != ''
        uses: actions/download-artifact@v4
        with:
          name: ${{ inputs.dist-artifact }}
          path: dist

      - name: Install workspace dependencies
        run: bun install --frozen-lockfile

      - name: Install Chromium
        working-directory: playwright
        run: bun run ../scripts/playwright-ci.ts install chromium

      - name: Check Playwright project discovery
        working-directory: playwright
        env:
          E2E_SERVER_MODE: ${{ inputs.server-mode }}
          PW_SERVER_SET: ${{ inputs.server-set }}
          PW_WORKERS: "2"
          PLAYWRIGHT_PROJECTS: ${{ inputs.projects }}
        shell: cmd
        run: bun run ../scripts/playwright-ci.ts test --list

      - name: Run Playwright gate
        working-directory: playwright
        env:
          E2E_SERVER_MODE: ${{ inputs.server-mode }}
          PW_SERVER_SET: ${{ inputs.server-set }}
          PW_WORKERS: "2"
          RACEIQ_DISABLE_TRAY: "1"
          PLAYWRIGHT_PROJECTS: ${{ inputs.projects }}
        shell: cmd
        run: bun run ../scripts/playwright-ci.ts test


      - name: Upload Playwright artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.artifact-name }}
          path: |
            playwright/test-results/
            playwright/screenshots/
          if-no-files-found: ignore
          retention-days: 7

      - name: Upload server diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.diagnostic-artifact-name }}
          path: |
            playwright/test-data*/raceiq.log
            playwright/test-data*/crash.log
            dist/crash.log
            crash.log
          retention-days: 7
          if-no-files-found: warn
