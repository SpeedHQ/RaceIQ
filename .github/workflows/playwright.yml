name: Playwright E2E+

on:
  workflow_call:
    inputs:
      server-mode:
        description: "Playwright server mode: dev or compiled"
        required: false
        type: string
        default: compiled
      runs-on:
        description: "Runner labels as JSON array; Windows is required for compiled native binary"
        required: false
        type: string
        default: '["whitesmith-windows-x64", "4VCPU", "10G"]'
      projects:
        description: "Playwright project flags passed to the gate"
        required: false
        type: string
        default: "--project=fresh-install --project=tunes --project=tunes-unseeded --project=seeded-e2e --project=seeded-routes --project=seeded-imports --project=mobile-device --project=tablet-device"
      server-set:
        description: "Playwright server set: all, fresh, tunes, tunes-unseeded, or seeded"
        required: false
        type: string
        default: all
      batches:
        description: "Optional ordered Playwright server-set batches as JSON"
        required: false
        type: string
        default: ""
      dist-artifact:
        description: "Optional prebuilt dist artifact for compiled-server gate"
        required: false
        type: string
        default: ""
      artifact-name:
        description: "Trace and test-result artifact name"
        required: false
        type: string
        default: playwright-results
      diagnostic-artifact-name:
        description: "Server diagnostic artifact name"
        required: false
        type: string
      target-ref:
        description: "Branch or ref to test"
        required: false
        type: string


jobs:
  playwright:
    runs-on: ${{ fromJSON(inputs.runs-on) }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.target-ref || github.ref }}

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Download dist artifact
        if: inputs.dist-artifact != ''
        uses: actions/download-artifact@v8
        with:
          name: ${{ inputs.dist-artifact }}
          path: dist
      - name: Restore compiled server permissions
        if: inputs.dist-artifact != '' && runner.os != 'Windows'
        run: chmod +x dist/raceiq


      - name: Install workspace dependencies
        shell: powershell
        run: |
          $ErrorActionPreference = "Continue"
          bun install --frozen-lockfile
          if ($LASTEXITCODE -eq 0) {
            exit 0
          }
          Write-Host "Initial Bun install failed; clearing node_modules and retrying with a forced package download."
          Remove-Item -Recurse -Force node_modules -ErrorAction SilentlyContinue
          bun install --frozen-lockfile --force
          exit $LASTEXITCODE

      - name: Install Chromium
        working-directory: playwright
        run: bun run ../scripts/playwright-ci.ts install chromium

      - name: Check Playwright project discovery
        if: inputs.batches == ''
        working-directory: playwright
        env:
          E2E_SERVER_MODE: ${{ inputs.server-mode }}
          PW_SERVER_SET: ${{ inputs.server-set }}
          PW_WORKERS: "1"
          PLAYWRIGHT_PROJECTS: ${{ inputs.projects }}
        shell: cmd
        run: bun run ../scripts/playwright-ci.ts test --list

      - name: Run Playwright gate
        if: inputs.batches == ''
        working-directory: playwright
        env:
          E2E_SERVER_MODE: ${{ inputs.server-mode }}
          PW_SERVER_SET: ${{ inputs.server-set }}
          PW_WORKERS: "1"
          RACEIQ_DISABLE_TRAY: "1"
          PLAYWRIGHT_PROJECTS: ${{ inputs.projects }}
        shell: cmd
        run: bun run ../scripts/playwright-ci.ts test

      - name: Run Playwright batch gate
        if: inputs.batches != ''
        working-directory: playwright
        env:
          E2E_SERVER_MODE: ${{ inputs.server-mode }}
          RACEIQ_DISABLE_TRAY: "1"
          PLAYWRIGHT_BATCHES: ${{ inputs.batches }}
        shell: cmd
        run: bun run ../scripts/playwright-batches.ts


      - name: Upload Playwright artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ${{ inputs.artifact-name }}
          path: |
            playwright/test-results/
            playwright/screenshots/
          if-no-files-found: ignore
          retention-days: 7

      - name: Upload server diagnostics
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ${{ inputs.diagnostic-artifact-name }}
          path: |
            playwright/test-data*/raceiq.log
            playwright/test-data*/crash.log
            playwright/test-results/**/raceiq.log
            playwright/test-results/**/crash.log
            dist/crash.log
            crash.log
          retention-days: 7
          if-no-files-found: warn
