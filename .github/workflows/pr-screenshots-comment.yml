name: Comment app screenshot diffs

# Runs after the dashboard screenshot or snapshot workflow completes. Downloads
# the rendered before/after/diff PNGs, hosts them on the throwaway
# `pr-previews` branch, and posts (or updates) a sticky PR comment showing
# every change from main. Also labels the PR "ui change".

#
# Security: this triggers on workflow_run, so it runs in the BASE repo context
# with a write token but does NOT check out or execute the PR's code. The PR's
# code only ever ran in the read-only render workflow.

on:
  workflow_run:
    workflows: ["Render dashboard screenshots", "Render dashboard snapshots"]
    types: [completed]

permissions:
  contents: write # push preview images to the pr-previews branch
  pull-requests: write # post/update the comment + label
  issues: write # create the label on first use
  actions: read # download the artifact from the triggering render run

jobs:
  comment:
    if: github.event.workflow_run.event == 'workflow_dispatch' || (github.event.workflow_run.event == 'pull_request' && github.event.workflow_run.pull_requests[0].draft != true)
    runs-on: ubuntu-latest
    env:
      REPO: ${{ github.repository }}
      PREVIEW_BRANCH: pr-previews
      RUN_ID: ${{ github.event.workflow_run.id }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Download preview artifact
        uses: actions/download-artifact@v4
        with:
          name: pr-screenshot-preview
          path: pr-preview
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ github.token }}

      - name: Read PR number and detect changes
        id: meta
        run: |
          pr=$(cat pr-preview/pr-number.txt)
          echo "pr=$pr" >> "$GITHUB_OUTPUT"
          if ls pr-preview/*-after.png >/dev/null 2>&1; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish preview images to pr-previews branch
        if: steps.meta.outputs.changed == 'true'
        id: publish
        env:
          PR: ${{ steps.meta.outputs.pr }}
        run: |
          subdir="pr-${PR}/${RUN_ID}"
          remote="https://x-access-token:${GH_TOKEN}@github.com/${REPO}.git"
          rm -rf preview-repo
          if git clone --depth 1 --single-branch --branch "$PREVIEW_BRANCH" "$remote" preview-repo 2>/dev/null; then
            cd preview-repo
          else
            git clone --depth 1 "$remote" preview-repo
            cd preview-repo
            git checkout --orphan "$PREVIEW_BRANCH"
            git rm -rf . >/dev/null 2>&1 || true
          fi
          mkdir -p "$subdir"
          cp ../pr-preview/*-before.png ../pr-preview/*-after.png ../pr-preview/*-diff.png "$subdir"/ 2>/dev/null || true
          git add "$subdir"
          git -c user.name="github-actions[bot]" \
              -c user.email="github-actions[bot]@users.noreply.github.com" \
              commit -m "preview: PR #${PR} dashboard screenshots (run ${RUN_ID})"
          git push origin "$PREVIEW_BRANCH"
          echo "subdir=$subdir" >> "$GITHUB_OUTPUT"

      - name: Compose and post sticky comment
        if: steps.meta.outputs.changed == 'true'
        env:
          PR: ${{ steps.meta.outputs.pr }}
          SUBDIR: ${{ steps.publish.outputs.subdir }}
        run: |
          marker='<!-- app-screenshot-diff -->'
          base="https://raw.githubusercontent.com/${REPO}/${PREVIEW_BRANCH}/${SUBDIR}"
          {
            echo "$marker"
            echo "## 🖼️ App UI changes"
            echo
            echo "Current PR screenshots compared with main. Added and removed screenshots are included."
            echo
            for after in pr-preview/*-after.png; do
              name=$(basename "$after" -after.png)
              if [[ "$name" == *"--"* ]]; then
                status=${name%%--*}
                label=${name#*--}
                label=${label//--/ /}
              else
                status=changed
                label=$name
              fi
              status_label="${status^}"
              echo "### ${status_label}: ${label}"
              echo
              echo "| Before | After | Diff |"
              echo "| --- | --- | --- |"
              echo "| ![before](${base}/${name}-before.png) | ![after](${base}/${name}-after.png) | ![diff](${base}/${name}-diff.png) |"
              echo
            done
            echo "<sub>Rendered from Storybook and responsive app screenshot tests against current main.</sub>"
          } > body.md

          # Replace previous UI-diff reports so each PR has one current comment.
          gh api --paginate "repos/${REPO}/issues/${PR}/comments" \
            --jq '.[] | select(.body | contains("<!-- app-screenshot-diff -->")) | .id' |
            while read -r comment_id; do
              gh api --method DELETE "repos/${REPO}/issues/comments/${comment_id}"
            done
          gh api "repos/${REPO}/issues/${PR}/comments" -F body=@body.md

      - name: Label PR as a UI change
        if: steps.meta.outputs.changed == 'true'
        env:
          PR: ${{ steps.meta.outputs.pr }}
          LABEL: "ui change"
        run: |
          # No repo is checked out in this job, so gh needs an explicit --repo.
          gh label create "$LABEL" --repo "$REPO" --color FFC0CB --description "Pull request changes rendered dashboard UI" 2>/dev/null || true
          gh pr edit "$PR" --repo "$REPO" --add-label "$LABEL"
