name: Comment app screenshot diffs

# Runs after the dashboard screenshot or snapshot workflow completes. Downloads
# the rendered before/after/diff PNGs, hosts them on the throwaway
# `pr-previews` branch, and posts (or updates) a sticky PR comment showing
# every change from the pull request's base branch. Also labels the PR "ui change".

#
# Security: this triggers on workflow_run, so it runs in the BASE repo context
# with a write token but does NOT check out or execute the PR's code. The PR's
# code only ever ran in the read-only render workflow.

on:
  workflow_run:
    workflows: ["Build & Test", "Render dashboard screenshots", "Render dashboard snapshots"]
    types: [completed]

permissions:
  contents: write # push preview images to the pr-previews branch
  pull-requests: write # post/update the comment + label
  issues: write # create the label on first use
  actions: read # download the artifact from the triggering render run

jobs:
  comment:
    timeout-minutes: 30
    if: >-
      github.event.workflow_run.event == 'workflow_dispatch' ||
      github.event.workflow_run.event == 'pull_request' ||
      github.event.workflow_run.event == 'workflow_call'
    runs-on:
      - mars-windows-x64-4vcpu-15g
      - mars-macos-arm64-2vcpu-10g
    permissions:
      contents: write
      pull-requests: write
      issues: write
      actions: read
    env:
      REPO: ${{ github.repository }}
      PREVIEW_BRANCH: pr-previews
      RUN_ID: ${{ github.event.workflow_run.id }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4
      - name: Check for preview artifact
        id: artifact
        uses: actions/github-script@v7
        with:
          script: |
            const { data } = await github.rest.actions.listWorkflowRunArtifacts({
              ...context.repo,
              run_id: context.payload.workflow_run.id,
              per_page: 100,
            });
            core.setOutput(
              "available",
              data.artifacts.some((artifact) => artifact.name === "pr-screenshot-preview" && !artifact.expired),
            );
      - name: Download preview artifact
        if: steps.artifact.outputs.available == 'true'
        uses: actions/download-artifact@v8
        with:
          name: pr-screenshot-preview
          path: pr-preview
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ github.token }}
      - name: Read PR number and detect changes
        id: meta
        if: steps.artifact.outputs.available == 'true'
        env:
          PR: ${{ github.event.workflow_run.pull_requests[0].number || '' }}
        run: bun scripts/ci/read-pr-screenshot-meta.ts
      - name: Publish preview images to pr-previews branch
        if: steps.meta.outputs.changed == 'true'
        id: publish
        env:
          PR: ${{ steps.meta.outputs.pr }}
        run: bun scripts/ci/publish-pr-screenshots.ts
      - name: Compose and post sticky comment
        if: steps.meta.outputs.changed == 'true'
        env:
          PR: ${{ steps.meta.outputs.pr }}
          SUBDIR: ${{ steps.publish.outputs.subdir }}
          BASE_REF: ${{ steps.meta.outputs.base-ref }}
        run: bun scripts/ci/comment-pr-screenshots.ts
      - name: Label PR as a UI change
        if: steps.meta.outputs.changed == 'true'
        env:
          PR: ${{ steps.meta.outputs.pr }}
          LABEL: "ui change"
        run: bun scripts/ci/label-pr-ui-change.ts
