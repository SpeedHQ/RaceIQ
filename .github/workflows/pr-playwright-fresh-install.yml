name: PR Playwright — Fresh Install

# Runs the Windows fresh-install / marketing Playwright suites (the ones that
# live under the root `playwright/` folder) on PRs that touch that folder or
# the reusable `playwright.yml` workflow. Expensive because it compiles the
# Windows raceiq.exe binary — scoped narrowly to playwright/** changes only.

on:
  pull_request:
    paths:
      - 'playwright/**'
      - '.github/workflows/playwright.yml'
      - '.github/workflows/pr-playwright-fresh-install.yml'

jobs:
  build:
    runs-on: blacksmith-2vcpu-windows-2025
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install

      - name: Build client
        run: cd client && bun install && bun run build

      - name: Prepare dist
        shell: bash
        run: mkdir -p dist && cp -r client/dist dist/public

      - name: Copy shared data
        run: bun scripts/copy-shared-data.ts

      - name: Compile server binary
        shell: bash
        run: NODE_ENV=production bun build --compile --target=bun-windows-x64 --define 'process.env.NODE_ENV="production"' server/bootstrap.ts --outfile dist/raceiq.exe

      - name: Copy libsql native addon
        shell: bash
        run: |
          mkdir -p dist/node_modules/@libsql/win32-x64-msvc
          cp node_modules/@libsql/win32-x64-msvc/index.node dist/node_modules/@libsql/win32-x64-msvc/
          cp node_modules/@libsql/win32-x64-msvc/package.json dist/node_modules/@libsql/win32-x64-msvc/

      - name: Upload dist artifact
        uses: actions/upload-artifact@v4
        with:
          name: raceiq-dist-pr
          path: dist/
          retention-days: 1

  fresh-install:
    needs: build
    uses: ./.github/workflows/playwright.yml
    with:
      dist-artifact: raceiq-dist-pr
