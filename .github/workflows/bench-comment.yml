name: Comment benchmark comparison

# Runs after the read-only benchmark workflow. Downloads comment text but never
# checks out or executes pull-request code with the write token.
on:
  workflow_run:
    workflows: ["Bench compare"]
    types: [completed]

permissions:
  actions: read
  issues: write
  pull-requests: write
jobs:
  comment:
    if: github.event.workflow_run.event == 'pull_request' && github.event.workflow_run.pull_requests[0].number != null
    runs-on:
      - mars-windows-x64
      - 4VCPU
      - 15G
    steps:
      - name: Find benchmark comment artifact
        id: artifact
        uses: actions/github-script@v9
        with:
          script: |
            const artifacts = await github.paginate(github.rest.actions.listWorkflowRunArtifacts, {
              ...context.repo,
              run_id: context.payload.workflow_run.id,
              per_page: 100,
            });
            return artifacts.some((artifact) => artifact.name === "benchmark-comment" && !artifact.expired);

      - name: Download benchmark comment
        if: steps.artifact.outputs.result == 'true'
        uses: actions/download-artifact@v8
        with:
          name: benchmark-comment
          path: benchmark-comment
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ github.token }}

      - name: Post fresh benchmark comment
        if: steps.artifact.outputs.result == 'true'
        uses: actions/github-script@v9
        with:
          script: |
            const { readFileSync } = require("node:fs");
            const { join } = require("node:path");
            const marker = "<!-- bench-comparison -->";
            const comparison = readFileSync(join(process.env.GITHUB_WORKSPACE, "benchmark-comment", "comparison.md"), "utf8").replace(/^\uFEFF/, "");
            const body = `${marker}\n${comparison}`;
            const issueNumber = context.payload.workflow_run.pull_requests[0].number;
            const comments = await github.paginate(github.rest.issues.listComments, {
              ...context.repo,
              issue_number: issueNumber,
              per_page: 100,
            });

            // Delete stale reports before posting so the current result appears last.
            for (const comment of comments) {
              if (comment.body?.includes(marker) || comment.body?.startsWith("## Bench comparison")) {
                await github.rest.issues.deleteComment({
                  ...context.repo,
                  comment_id: comment.id,
                });
              }
            }
            await github.rest.issues.createComment({
              ...context.repo,
              issue_number: issueNumber,
              body,
            });
