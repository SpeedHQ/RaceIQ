name: Native telemetry replay (manual)

# GitHub-hosted Windows runners cannot launch or attach to installed games,
# UDP providers, shared-memory providers, or wheel/permission surfaces. This
# lane therefore proves committed native recordings only; it never fabricates
# a live-capture pass.
on:
  workflow_dispatch:
    inputs:
      game:
        description: "Committed replay catalog to run"
        required: true
        type: choice
        options:
          - fm-2023
          - f1-2025
          - acc
          - ac-evo
          - iracing

concurrency:
  group: native-replay-${{ github.ref_name }}
  cancel-in-progress: true

jobs:
  replay:
    timeout-minutes: 30
    runs-on:
      - mars-windows-x64-4vcpu-15g
      - mars-macos-arm64-2vcpu-10g
    steps:
      - uses: actions/checkout@v7

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4

      - name: Install workspace dependencies
        run: bun scripts/ci/workflow-ops.ts install-retry

      - name: Replay committed native recording
        run: bun test test/telemetry/catalog/telemetry-catalog-${{ inputs.game }}-e2e.test.ts

      - name: Record capture blocker in run summary
        if: always()
        env:
          GAME: ${{ inputs.game }}
        run: bun scripts/ci/workflow-ops.ts native-summary

      - name: Upload replay artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: native-replay-${{ inputs.game }}
          path: |
            test-results/
            test/artifacts/sessions/
          if-no-files-found: ignore
          retention-days: 7
