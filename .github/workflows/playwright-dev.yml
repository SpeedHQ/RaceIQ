name: Playwright E2E (compiled server)

on:
  workflow_call:

jobs:
  playwright-dev:
    uses: ./.github/workflows/playwright.yml
    with:
      server-mode: compiled
      runs-on: blacksmith-4vcpu-ubuntu-2204
      projects: "--project=fresh-install --project=tunes --project=seeded-e2e --project=mobile-device --project=tablet-device"
      dist-artifact: raceiq-dist-linux
      artifact-name: playwright-dev-results
