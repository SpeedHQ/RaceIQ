name: Playwright E2E (compiled PR gate)

on:
  workflow_call:

jobs:
  playwright:
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: fresh
            server-set: fresh
            projects: "--project=fresh-install"
            artifact: playwright-compiled-fresh
          - name: tunes
            server-set: tunes
            projects: "--project=tunes"
            artifact: playwright-compiled-tunes
          - name: seeded
            server-set: seeded
            projects: "--project=seeded-e2e --project=mobile-device --project=tablet-device"
            artifact: playwright-compiled-seeded
    uses: ./.github/workflows/playwright.yml
    with:
      server-mode: compiled
      server-set: ${{ matrix.server-set }}
      runs-on: whitesmith-windows-x64
      projects: ${{ matrix.projects }}
      dist-artifact: raceiq-dist-windows
      artifact-name: ${{ matrix.artifact }}
