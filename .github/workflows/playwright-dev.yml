name: Playwright E2E (compiled PR gate)

on:
  workflow_call:
    inputs:
      target-ref:
        description: "Branch or ref to test"
        required: false
        type: string

jobs:
  playwright-light:
    uses: ./.github/workflows/playwright.yml
    with:
      server-mode: compiled
      runs-on: '["whitesmith-windows-x64", "4VCPU", "10G"]'
      dist-artifact: raceiq-dist-windows
      batches: >-
        [
          {"name":"fresh","serverSet":"fresh","projects":"--project=fresh-install","workers":1},
          {"name":"tunes","serverSet":"tunes","projects":"--project=tunes","workers":1},
          {"name":"tunes-unseeded","serverSet":"tunes-unseeded","projects":"--project=tunes-unseeded","workers":1}
        ]
      artifact-name: playwright-results-light
      diagnostic-artifact-name: server-diagnostics-light
      target-ref: ${{ inputs.target-ref }}

  playwright-seeded:
    needs: playwright-light
    if: ${{ always() }}
    uses: ./.github/workflows/playwright.yml
    with:
      server-mode: compiled
      runs-on: '["whitesmith-windows-x64", "10VCPU", "15G"]'
      dist-artifact: raceiq-dist-windows
      parallel-batches: true
      batches: >-
        [
          {"name":"seeded-heavy","serverSet":"seeded","projects":"--project=seeded-heavy","workers":1,"isolation":1},
          {"name":"seeded-standard","serverSet":"seeded","projects":"--project=seeded-e2e --project=seeded-routes --project=seeded-imports --project=mobile-device --project=tablet-device","workers":1,"isolation":2}
        ]
      artifact-name: playwright-results-seeded
      diagnostic-artifact-name: server-diagnostics-seeded
      target-ref: ${{ inputs.target-ref }}
