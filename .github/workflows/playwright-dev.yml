name: Playwright E2E (compiled PR gate)

on:
  workflow_call:

jobs:
  playwright:
    uses: ./.github/workflows/playwright.yml
    with:
      server-mode: compiled
      server-set: all
      projects: --project=fresh-install --project=tunes --project=seeded-e2e --project=seeded-routes --project=seeded-imports --project=mobile-device --project=tablet-device
      runs-on: '["whitesmith-windows-x64", "10VCPU", "25G"]'
      dist-artifact: raceiq-dist-windows
      artifact-name: playwright
      diagnostic-artifact-name: server-diagnostics
