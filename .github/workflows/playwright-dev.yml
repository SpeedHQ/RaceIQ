name: Playwright E2E (compiled PR gate)

on:
  workflow_call:

jobs:
  playwright-dev:
    uses: ./.github/workflows/playwright.yml
    with:
      server-mode: compiled
      runs-on: whitesmith-windows-x64
      projects: "--project=fresh-install --project=tunes --project=seeded-e2e --project=mobile-device --project=tablet-device"
      dist-artifact: raceiq-dist-windows
      artifact-name: playwright-compiled-results
