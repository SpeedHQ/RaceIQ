name: Playwright E2E (dev server)

on:
  workflow_call:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  playwright-dev:
    uses: ./.github/workflows/playwright.yml
    with:
      server-mode: dev
      runs-on: blacksmith-4vcpu-ubuntu-2204
      projects: "--project=fresh-install --project=tunes --project=seeded-e2e --project=mobile-device --project=tablet-device"
      artifact-name: playwright-dev-results
