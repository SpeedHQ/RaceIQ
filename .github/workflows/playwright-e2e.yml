name: Playwright E2E (compiled cross-platform gate)

on:
  workflow_call:
    inputs:
      target-ref:
        description: "Branch or ref to test"
        required: false
        type: string
      paraglide-artifact:
        description: "Optional compiled Paraglide artifact from the upstream build"
        required: false
        type: string
        default: ""

jobs:
  seed-database:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.target-ref || github.ref }}

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4

      - name: Install workspace dependencies
        run: bun scripts/ci/workflow-ops.ts install-retry

      - name: Prepare seeded database
        env:
          DATA_DIR: playwright/test-data-seed-producer
        run: bun playwright/support/server/prepare-seeded-database.ts

      - name: Upload seeded database
        uses: actions/upload-artifact@v7
        with:
          name: playwright-seeded-database
          path: |
            playwright/test-data-seed-producer/app.db
            playwright/test-data-seed-producer/chat-memory.db
            playwright/test-data-seed-producer/sessions/
          if-no-files-found: error
          retention-days: 1

  playwright:
    needs: seed-database
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: fresh
            server_set: fresh
            projects: --project=fresh-install
            runs_on: '["windows-latest"]'
          - name: tunes
            server_set: tunes
            projects: --project=tunes
            runs_on: '["windows-latest"]'
          - name: tunes-unseeded
            server_set: tunes-unseeded
            projects: --project=tunes-unseeded
            runs_on: '["windows-latest"]'
          - name: seeded-shard-1
            server_set: seeded
            projects: --project=seeded-e2e --project=seeded-routes --project=seeded-imports --project=mobile-device --project=tablet-device
            shard: 1/7
            runs_on: '["windows-latest"]'
          - name: seeded-shard-2
            server_set: seeded
            projects: --project=seeded-e2e --project=seeded-routes --project=seeded-imports --project=mobile-device --project=tablet-device
            shard: 2/7
            runs_on: '["windows-latest"]'
          - name: seeded-shard-3
            server_set: seeded
            projects: --project=seeded-e2e --project=seeded-routes --project=seeded-imports --project=mobile-device --project=tablet-device
            shard: 3/7
            runs_on: '["windows-latest"]'
          - name: seeded-shard-4
            server_set: seeded
            projects: --project=seeded-e2e --project=seeded-routes --project=seeded-imports --project=mobile-device --project=tablet-device
            shard: 4/7
            runs_on: '["windows-latest"]'
          - name: seeded-shard-5
            server_set: seeded
            projects: --project=seeded-e2e --project=seeded-routes --project=seeded-imports --project=mobile-device --project=tablet-device
            shard: 5/7
            runs_on: '["windows-latest"]'
          - name: seeded-shard-6
            server_set: seeded
            projects: --project=seeded-e2e --project=seeded-routes --project=seeded-imports --project=mobile-device --project=tablet-device
            shard: 6/7
            runs_on: '["windows-latest"]'
          - name: seeded-shard-7
            server_set: seeded
            projects: --project=seeded-e2e --project=seeded-routes --project=seeded-imports --project=mobile-device --project=tablet-device
            shard: 7/7
            runs_on: '["windows-latest"]'
    uses: ./.github/workflows/playwright.yml
    with:
      server-mode: compiled
      server-set: ${{ matrix.server_set }}
      projects: ${{ matrix.projects }}
      shard: ${{ matrix.shard }}
      runs-on: ${{ matrix.runs_on }}
      artifact-name: playwright-${{ matrix.name }}
      diagnostic-artifact-name: server-diagnostics-${{ matrix.name }}
      target-ref: ${{ inputs.target-ref }}
      seed-database-artifact: ${{ matrix.server_set == 'seeded' && 'playwright-seeded-database' || '' }}
      paraglide-artifact: ${{ inputs.paraglide-artifact }}
