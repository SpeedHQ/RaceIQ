name: Playwright E2E (compiled cross-platform gate)

on:
  workflow_call:
    inputs:
      target-ref:
        description: "Branch or ref to test"
        required: false
        type: string
      dist-artifact:
        description: "Optional prebuilt dist artifact from the upstream build"
        required: false
        type: string
        default: ""
      paraglide-artifact:
        description: "Optional compiled Paraglide artifact from the upstream build"
        required: false
        type: string
      runner-labels:
        description: "JSON list of runner labels for seed and E2E jobs"
        required: false
        type: string
        default: '["mars-ubuntu-2vcpu-6g", "mars-retry-3"]'
      hardware-webgpu:
        description: "Run the WebGPU gate (software adapters allowed; hardware not guaranteed)"
        required: false
        type: boolean
        default: true

jobs:
  seed-database:
    name: Seed database
    runs-on: ${{ fromJSON(inputs.runner-labels)[0] }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.target-ref || github.ref }}

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4

      - name: Install workspace dependencies
        run: bun scripts/ci/workflow-ops.ts install-retry

      - name: Prepare seeded database
        env:
          DATA_DIR: playwright/test-data-seed-producer
        run: bun playwright/support/server/prepare-seeded-database.ts

      - name: Upload seeded database
        uses: actions/upload-artifact@v7
        with:
          name: playwright-seeded-database
          path: |
            playwright/test-data-seed-producer/app.db
            playwright/test-data-seed-producer/chat-memory.db
            playwright/test-data-seed-producer/sessions/
          if-no-files-found: error
          retention-days: 1

  playwright:
    name: E2E matrix
    needs: seed-database
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: fresh
            server_set: fresh
            projects: --project=fresh-install
          - name: tunes
            server_set: tunes
            projects: --project=tunes
          - name: tunes-unseeded
            server_set: tunes-unseeded
            projects: --project=tunes-unseeded
          - name: seeded-shard-1
            server_set: seeded
            projects: --project=seeded-e2e --project=seeded-routes --project=seeded-imports --project=tracks-catalogue --project=cars-catalogue --project=lap-replay --project=sessions-page --project=session-analyse
            shard: 1/7
          - name: seeded-shard-2
            server_set: seeded
            projects: --project=seeded-e2e --project=seeded-routes --project=seeded-imports --project=tracks-catalogue --project=cars-catalogue --project=lap-replay --project=sessions-page --project=session-analyse
            shard: 2/7
          - name: seeded-shard-3
            server_set: seeded
            projects: --project=seeded-e2e --project=seeded-routes --project=seeded-imports --project=tracks-catalogue --project=cars-catalogue --project=lap-replay --project=sessions-page --project=session-analyse
            shard: 3/7
          - name: seeded-shard-4
            server_set: seeded
            projects: --project=seeded-e2e --project=seeded-routes --project=seeded-imports --project=tracks-catalogue --project=cars-catalogue --project=lap-replay --project=sessions-page --project=session-analyse
            shard: 4/7
          - name: seeded-shard-5
            server_set: seeded
            projects: --project=seeded-e2e --project=seeded-routes --project=seeded-imports --project=tracks-catalogue --project=cars-catalogue --project=lap-replay --project=sessions-page --project=session-analyse
            shard: 5/7
          - name: seeded-shard-6
            server_set: seeded
            projects: --project=seeded-e2e --project=seeded-routes --project=seeded-imports --project=tracks-catalogue --project=cars-catalogue --project=lap-replay --project=sessions-page --project=session-analyse
            shard: 6/7
          - name: seeded-shard-7
            server_set: seeded
            projects: --project=seeded-e2e --project=seeded-routes --project=seeded-imports --project=tracks-catalogue --project=cars-catalogue --project=lap-replay --project=sessions-page --project=session-analyse
            shard: 7/7
    uses: ./.github/workflows/playwright.yml
    with:
      server-mode: compiled
      server-set: ${{ matrix.server_set }}
      projects: ${{ matrix.projects }}
      shard: ${{ matrix.shard }}
      runs-on: ${{ inputs.runner-labels }}
      artifact-name: playwright-${{ matrix.name }}
      diagnostic-artifact-name: server-diagnostics-${{ matrix.name }}
      target-ref: ${{ inputs.target-ref }}
      seed-database-artifact: ${{ matrix.server_set == 'seeded' && 'playwright-seeded-database' || '' }}
      paraglide-artifact: ${{ inputs.paraglide-artifact }}
      dist-artifact: ${{ inputs.dist-artifact }}

  playwright-webgpu:
    name: WebGPU (software allowed; hardware not guaranteed)
    if: inputs.hardware-webgpu
    needs: seed-database
    uses: ./.github/workflows/playwright.yml
    with:
      server-mode: compiled
      server-set: seeded
      projects: --project=lap-replay-webgpu
      runs-on: ${{ inputs.runner-labels }}
      artifact-name: playwright-lap-replay-webgpu
      diagnostic-artifact-name: server-diagnostics-lap-replay-webgpu
      target-ref: ${{ inputs.target-ref }}
      seed-database-artifact: playwright-seeded-database
      paraglide-artifact: ${{ inputs.paraglide-artifact }}
      dist-artifact: ${{ inputs.dist-artifact }}
