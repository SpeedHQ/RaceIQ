name: Telemetry soak

on:
  schedule:
    - cron: "17 8 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  telemetry-soak:
    runs-on: blacksmith-2vcpu-ubuntu-2204
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run telemetry soak
        run: bun run bench:telemetry:soak --output=telemetry-soak-results.json

      - name: Upload telemetry soak report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: telemetry-soak-results
          path: telemetry-soak-results.json
          if-no-files-found: ignore
          retention-days: 14
