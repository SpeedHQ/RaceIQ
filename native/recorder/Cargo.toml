[package]
name = "raceiq-recorder"
version = "0.1.0"
edition = "2024"
rust-version = "1.90"

[lib]
name = "raceiq_recorder"
path = "src/lib.rs"

[[bin]]
name = "raceiq-recorder"
path = "src/main.rs"

[dependencies]
base64 = "0.22"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rmp-serde = "1"
uuid = { version = "1", features = ["v4"] }
socket2 = "0.6"
flate2 = "1"
zip = { version = "6", default-features = false, features = ["deflate"] }
quick-xml = "0.38"
duckdb = { version = "1", features = ["bundled"] }
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_System_Memory", "Win32_Security", "Win32_System_Threading", "Win32_Media_Multimedia", "Win32_System_Diagnostics_ToolHelp"] }
